<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zishu AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f7fc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px 24px 16px;
            color: #1a2332;
            overflow: hidden;
            transition: background 0.4s ease, color 0.4s ease;
            user-select: none;
        }
        body.dark-mode {
            background: #0a0e17;
            color: #e8edf5;
        }
        body.dark-mode #chat-wrapper {
            background: #131b2e;
            border-color: #1e2a3f;
        }
        body.dark-mode #chat-container::-webkit-scrollbar-track {
            background: #1a2438;
        }
        body.dark-mode #chat-container::-webkit-scrollbar-thumb {
            background: #2a3a55;
        }
        body.dark-mode .assistant-msg {
            background: #1a2438;
            color: #e8edf5;
        }
        body.dark-mode .user-msg {
            background: #3b82f6;
        }
        body.dark-mode .tool-msg {
            background: #1a2438;
            color: #8aa0c0;
        }
        body.dark-mode .stop-msg {
            background: #2a1a1a;
            color: #ff6b6b;
        }
        body.dark-mode #status-badge {
            background: #1a2438;
            color: #8aa0c0;
        }
        body.dark-mode #status-badge.active {
            background: #3b82f6;
            color: white;
        }
        body.dark-mode #orb-status {
            color: #e8edf5;
        }
        body.dark-mode #orb-sub {
            color: #8aa0c0;
        }
        body.dark-mode #footer {
            color: #4a5a7a;
        }
        body.dark-mode #brand .sub {
            color: #8aa0c0;
            -webkit-text-fill-color: #8aa0c0;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-shrink: 0;
            padding: 0 4px;
        }
        #header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #brand svg {
            width: 32px;
            height: 32px;
        }
        #brand h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #3b82f6, #7b6cf7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #brand .sub {
            font-size: 12px;
            font-weight: 400;
            color: #6b7a8f;
            -webkit-text-fill-color: #6b7a8f;
            background: none;
            margin-left: 4px;
        }
        #header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #status-badge {
            font-size: 13px;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 30px;
            background: #e9edf4;
            color: #6b7a8f;
            transition: all 0.3s ease;
        }
        #status-badge.active {
            background: #3b82f6;
            color: white;
        }
        #dark-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9edf4;
            width: 40px;
            height: 40px;
        }
        body.dark-mode #dark-toggle {
            background: #1a2438;
        }
        #dark-toggle svg {
            width: 24px;
            height: 24px;
            fill: #1a2332;
            transition: fill 0.3s ease;
        }
        body.dark-mode #dark-toggle svg {
            fill: #e8edf5;
        }
        #dark-toggle:hover {
            transform: scale(1.05);
        }

        /* Premium 3D Orb */
        #orb-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 0 16px;
            flex-shrink: 0;
            position: relative;
            perspective: 800px;
        }

        #orb-wrapper {
            width: 130px;
            height: 130px;
            position: relative;
            transform-style: preserve-3d;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: floatOrb 4s ease-in-out infinite;
            z-index: 10;
        }
        #orb-wrapper:hover {
            transform: scale(1.05) rotateX(2deg);
        }
        #orb-wrapper:active {
            transform: scale(0.95);
        }

        @keyframes floatOrb {
            0%, 100% { transform: translateY(0px) rotateX(0deg); }
            50% { transform: translateY(-8px) rotateX(2deg); }
        }

        #orb-glow {
            position: absolute;
            width: 180px;
            height: 180px;
            top: -25px;
            left: -25px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            filter: blur(20px);
            animation: glowPulse 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        #orb {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(ellipse at 30% 25%, #ffffff, #e8ecf0 50%, #c8ced6 80%, #b0b8c4);
            box-shadow: 
                inset -20px -20px 40px rgba(0,0,0,0.12),
                inset 15px 15px 30px rgba(255,255,255,0.8),
                0 20px 60px rgba(59, 130, 246, 0.15),
                0 0 40px rgba(59, 130, 246, 0.05);
            transform: rotateX(-5deg) rotateY(-5deg);
            transition: all 0.6s ease;
            z-index: 1;
            cursor: pointer;
            background-image: 
                radial-gradient(ellipse at 35% 30%, rgba(255,255,255,0.9) 0%, transparent 60%),
                radial-gradient(ellipse at 65% 70%, rgba(200,210,220,0.3) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.2) 0%, transparent 30%);
        }

        #orb-ring {
            position: absolute;
            width: 140px;
            height: 140px;
            top: -5px;
            left: -5px;
            border-radius: 50%;
            border: 2px solid rgba(59, 130, 246, 0.08);
            box-shadow: inset 0 0 30px rgba(59, 130, 246, 0.03);
            z-index: 0;
            pointer-events: none;
        }

        #orb-visor {
            position: absolute;
            width: 80px;
            height: 56px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(5deg);
            border-radius: 50%;
            background: radial-gradient(ellipse at 45% 40%, #2a2a3a, #0a0a12 60%, #000000);
            box-shadow: 
                inset -5px -5px 15px rgba(0,0,0,0.5),
                inset 5px 5px 15px rgba(255,255,255,0.05),
                0 0 30px rgba(59, 130, 246, 0.08);
            z-index: 2;
            border: 1px solid rgba(255,255,255,0.03);
            overflow: hidden;
        }
        #orb-visor::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 12px;
            width: 20px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(255,255,255,0.05) 0%, transparent 70%);
            transform: rotate(-20deg);
        }

        #orb-eyes {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 20px;
            z-index: 3;
        }
        .eye {
            width: 12px;
            height: 16px;
            border-radius: 50%;
            background: radial-gradient(ellipse at 50% 40%, #8cf0ff, #3b82f6 50%, #1a4a8a);
            box-shadow: 
                0 0 20px rgba(59, 130, 246, 0.4),
                0 0 40px rgba(59, 130, 246, 0.15),
                inset 0 2px 4px rgba(255,255,255,0.3);
            animation: eyeGlow 3s ease-in-out infinite;
            transition: all 0.3s ease;
        }
        .eye.left {
            animation-delay: 0.2s;
        }
        .eye.right {
            animation-delay: 0.8s;
        }

        @keyframes eyeGlow {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.4), 0 0 40px rgba(59, 130, 246, 0.15);
                opacity: 1;
            }
            50% { 
                box-shadow: 0 0 30px rgba(59, 130, 246, 0.6), 0 0 60px rgba(59, 130, 246, 0.25);
                opacity: 0.95;
            }
        }

        .eye::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            filter: blur(1px);
        }

        /* Energy Ribbon */
        #orb-ribbon {
            position: absolute;
            width: 180px;
            height: 180px;
            top: -25px;
            left: -25px;
            z-index: 4;
            pointer-events: none;
            transform: rotateX(-10deg) rotateY(5deg);
            filter: drop-shadow(0 0 30px rgba(59, 130, 246, 0.15));
        }

        .ribbon-wave {
            position: absolute;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #3b82f6;
            border-right-color: #7b6cf7;
            border-bottom-color: #4fc3f7;
            border-left-color: #00bcd4;
            opacity: 0.6;
            animation: ribbonSpin 8s linear infinite;
            filter: blur(1px);
        }
        .ribbon-wave:nth-child(1) {
            width: 170px;
            height: 170px;
            top: 5px;
            left: 5px;
            border-width: 3px;
            animation-duration: 12s;
            border-top-color: #3b82f6;
            border-right-color: #64b5f6;
            border-bottom-color: #4fc3f7;
            border-left-color: #00bcd4;
            opacity: 0.5;
        }
        .ribbon-wave:nth-child(2) {
            width: 155px;
            height: 155px;
            top: 12px;
            left: 12px;
            border-width: 2.5px;
            animation-duration: 9s;
            animation-direction: reverse;
            border-top-color: #7b6cf7;
            border-right-color: #3b82f6;
            border-bottom-color: #00bcd4;
            border-left-color: #4fc3f7;
            opacity: 0.4;
        }
        .ribbon-wave:nth-child(3) {
            width: 140px;
            height: 140px;
            top: 20px;
            left: 20px;
            border-width: 2px;
            animation-duration: 15s;
            border-top-color: #4fc3f7;
            border-right-color: #3b82f6;
            border-bottom-color: #7b6cf7;
            border-left-color: #64b5f6;
            opacity: 0.35;
        }
        .ribbon-wave:nth-child(4) {
            width: 125px;
            height: 125px;
            top: 27px;
            left: 27px;
            border-width: 2px;
            animation-duration: 7s;
            animation-direction: reverse;
            border-top-color: #00bcd4;
            border-right-color: #4fc3f7;
            border-bottom-color: #3b82f6;
            border-left-color: #7b6cf7;
            opacity: 0.3;
        }

        @keyframes ribbonSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.02); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Orb States */
        #orb-wrapper.listening #orb {
            box-shadow: 
                inset -20px -20px 40px rgba(0,0,0,0.12),
                inset 15px 15px 30px rgba(255,255,255,0.8),
                0 20px 60px rgba(59, 130, 246, 0.3),
                0 0 80px rgba(59, 130, 246, 0.1);
            animation: orbPulse 1.2s ease-in-out infinite;
        }
        #orb-wrapper.listening #orb-visor {
            box-shadow: 
                inset -5px -5px 15px rgba(0,0,0,0.5),
                inset 5px 5px 15px rgba(255,255,255,0.05),
                0 0 50px rgba(59, 130, 246, 0.15);
        }
        #orb-wrapper.listening .eye {
            animation: eyeListening 0.8s ease-in-out infinite;
        }

        #orb-wrapper.thinking #orb {
            box-shadow: 
                inset -20px -20px 40px rgba(0,0,0,0.12),
                inset 15px 15px 30px rgba(255,255,255,0.8),
                0 20px 60px rgba(123, 108, 247, 0.3),
                0 0 80px rgba(123, 108, 247, 0.1);
            animation: orbSpin 2s linear infinite;
        }
        #orb-wrapper.thinking #orb-visor {
            box-shadow: 
                inset -5px -5px 15px rgba(0,0,0,0.5),
                inset 5px 5px 15px rgba(255,255,255,0.05),
                0 0 50px rgba(123, 108, 247, 0.15);
        }
        #orb-wrapper.thinking .eye {
            animation: eyeThinking 1.2s ease-in-out infinite;
        }

        #orb-wrapper.speaking #orb {
            box-shadow: 
                inset -20px -20px 40px rgba(0,0,0,0.12),
                inset 15px 15px 30px rgba(255,255,255,0.8),
                0 20px 60px rgba(59, 130, 246, 0.35),
                0 0 100px rgba(59, 130, 246, 0.15);
            animation: orbSpeak 0.6s ease-in-out infinite alternate;
        }
        #orb-wrapper.speaking #orb-visor {
            box-shadow: 
                inset -5px -5px 15px rgba(0,0,0,0.5),
                inset 5px 5px 15px rgba(255,255,255,0.05),
                0 0 60px rgba(59, 130, 246, 0.2);
        }
        #orb-wrapper.speaking .eye {
            animation: eyeSpeaking 0.4s ease-in-out infinite alternate;
        }

        @keyframes orbPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        @keyframes orbSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes orbSpeak {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.02) translateY(-3px); }
        }
        @keyframes eyeListening {
            0%, 100% { height: 16px; width: 12px; }
            50% { height: 18px; width: 14px; }
        }
        @keyframes eyeThinking {
            0%, 100% { border-radius: 50%; }
            50% { border-radius: 30%; }
        }
        @keyframes eyeSpeaking {
            0% { height: 16px; width: 12px; }
            100% { height: 20px; width: 10px; }
        }

        #orb-status {
            margin-top: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #1a2332;
            letter-spacing: -0.2px;
            transition: color 0.3s ease;
            z-index: 5;
            position: relative;
        }
        #orb-sub {
            font-size: 13px;
            color: #6b7a8f;
            margin-top: 4px;
            font-weight: 400;
            transition: color 0.3s ease;
            z-index: 5;
            position: relative;
        }

        #chat-wrapper {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid #e9edf4;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            scroll-behavior: smooth;
            will-change: transform;
        }
        #chat-container::-webkit-scrollbar {
            width: 4px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: #f1f4f9;
            transition: background 0.3s ease;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: #d0d8e3;
            border-radius: 10px;
        }
        .message {
            margin: 8px 0;
            padding: 12px 18px;
            border-radius: 16px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease;
            line-height: 1.7;
            font-size: 15px;
            font-weight: 400;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            will-change: transform, opacity;
        }
        .user-msg {
            background: #3b82f6;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .assistant-msg {
            background: #f1f4f9;
            color: #1a2332;
            margin-right: auto;
            border-bottom-left-radius: 4px;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .message .sender {
            font-weight: 600;
            font-size: 12px;
            opacity: 0.7;
            display: block;
            margin-bottom: 3px;
            letter-spacing: 0.3px;
        }
        .assistant-msg .sender {
            color: #6b7a8f;
        }
        .user-msg .sender {
            color: rgba(255, 255, 255, 0.8);
        }
        .message .content {
            display: block;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .tool-msg {
            background: #e9edf4;
            color: #6b7a8f;
            margin: 6px auto;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            text-align: center;
            max-width: 85%;
            font-weight: 450;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .stop-msg {
            background: #f8d7da;
            color: #721c24;
            margin: 6px auto;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            text-align: center;
            max-width: 85%;
            font-weight: 450;
            animation: fadeIn 0.3s ease;
        }
        .action-msg {
            background: #d4edda;
            color: #155724;
            margin: 6px auto;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            text-align: center;
            max-width: 85%;
            font-weight: 450;
            animation: fadeIn 0.3s ease;
        }
        .alarm-msg {
            background: #f0e6d2;
            color: #8a6d3b;
            margin: 6px auto;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            text-align: center;
            max-width: 85%;
            font-weight: 600;
            animation: flashAlarm 1s ease-in-out infinite alternate;
            border: 2px solid #ff9800;
        }
        @keyframes flashAlarm {
            0% { background: #f0e6d2; }
            100% { background: #ffcc80; }
        }
        .reminder-msg {
            background: #d1ecf1;
            color: #0c5460;
            margin: 6px auto;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            text-align: center;
            max-width: 85%;
            font-weight: 600;
            animation: fadeIn 0.5s ease;
            border: 2px solid #17a2b8;
        }
        #footer {
            display: flex;
            justify-content: space-between;
            padding: 10px 4px 0;
            flex-shrink: 0;
            font-size: 12px;
            color: #9aa9bb;
            letter-spacing: 0.2px;
            transition: color 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (max-width: 480px) {
            body {
                padding: 12px 14px 10px;
            }
            #orb-wrapper {
                width: 100px;
                height: 100px;
            }
            #orb {
                width: 100px;
                height: 100px;
            }
            #orb-visor {
                width: 62px;
                height: 44px;
            }
            #orb-eyes {
                gap: 16px;
            }
            .eye {
                width: 10px;
                height: 13px;
            }
            #orb-ribbon {
                width: 140px;
                height: 140px;
                top: -20px;
                left: -20px;
            }
            .ribbon-wave:nth-child(1) {
                width: 135px;
                height: 135px;
            }
            .ribbon-wave:nth-child(2) {
                width: 120px;
                height: 120px;
            }
            .ribbon-wave:nth-child(3) {
                width: 108px;
                height: 108px;
            }
            .ribbon-wave:nth-child(4) {
                width: 96px;
                height: 96px;
            }
            #orb-glow {
                width: 140px;
                height: 140px;
                top: -20px;
                left: -20px;
            }
            #brand h1 {
                font-size: 18px;
            }
            #brand .sub {
                font-size: 10px;
            }
            #orb-status {
                font-size: 14px;
            }
            .message {
                font-size: 14px;
                padding: 10px 14px;
                max-width: 88%;
            }
            #chat-container {
                padding: 14px 16px;
            }
            #status-badge {
                font-size: 11px;
                padding: 4px 12px;
            }
            #dark-toggle {
                width: 34px;
                height: 34px;
                padding: 6px;
            }
            #dark-toggle svg {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
<body>

    <div id="header">
        <div id="header-left">
            <div id="brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="1.8">
                    <defs>
                        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#3b82f6" />
                            <stop offset="100%" stop-color="#7b6cf7" />
                        </linearGradient>
                    </defs>
                    <circle cx="12" cy="12" r="10" />
                    <path d="M8 12l2 2 4-4" />
                    <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                </svg>
                <div style="display:flex;align-items:baseline;gap:6px;">
                    <h1>ZISHU</h1>
                    <span class="sub">voice intelligence</span>
                </div>
            </div>
        </div>
        <div id="header-right">
            <div id="status-badge">● Idle</div>
            <button id="dark-toggle" aria-label="Toggle dark mode">
                <svg viewBox="0 0 24 24">

        // ============================================================

        function initializeVoiceSystem() {
            console.log('🎤 Initializing voice system...');

                if (window.speechSynthesis) {
                    // Cancel any pending speech

                    // Attempt to resume

                    // Force load voices

                            window.speechSynthesis.getVoices();
                        }, 500);

                    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

                        recognition = new SR();
                        recognition.lang = 'hi-IN';

                        recognition.interimResults = false;

                            clearRestartTimer();

                                setOrbState(STATE.IDLE);

        // ============================================================
        // ACTION HANDLERS - Alarm, Reminder, Notes (with real functionality)
        // ============================================================
        function handleActions(query) {
            const q = query.toLowerCase().trim();
            
            // Alarm
            if (q.includes('alarm') || q.includes('अलार्म') || q.includes('alarm lagao') || q.includes('set alarm')) {
                // Parse time
                const timeMatch = parseAlarmTime(q);
                if (timeMatch) {
                    const { hours, minutes, dateTime } = timeMatch;
                    if (dateTime && dateTime > new Date()) {
                        // Store alarm
                        const alarmId = 'alarm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                        const alarmData = {
                            id: alarmId,
                            time: dateTime.toISOString(),
                            message: q,
                            active: true,
                            triggered: false
                        };
                        const alarms = JSON.parse(localStorage.getItem('zishu_alarms') || '[]');
                        alarms.push(alarmData);
                        localStorage.setItem('zishu_alarms', JSON.stringify(alarms));
                        // Schedule the alarm
                        scheduleAlarm(alarmData);
                        const timeStr = dateTime.toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
                        return `⏰ Alarm set for ${timeStr}. Main yaad dilaunga!`;
                    } else {
                        return "⏰ Time already passed. Kal ke liye set kar raha hoon?";
                    }
                }
                return "⏰ Alarm ke liye time batao jaise 'alarm 7 baje' ya 'alarm 9:30 am'";
            }
            
            // Reminder
            if (q.includes('remind') || q.includes('reminder') || q.includes('याद') || q.includes('याद दिलाओ') || q.includes('remind me')) {
                // Try to parse time and text
                const result = parseReminderTimeAndText(q);
                if (result) {
                    const { text, dateTime } = result;
                    if (dateTime && dateTime > new Date()) {
                        const reminderId = 'reminder_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                        const reminderData = {
                            id: reminderId,
                            text: text,
                            time: dateTime.toISOString(),
                            created: new Date().toISOString(),
                            triggered: false,
                            active: true
                        };
                        const reminders = JSON.parse(localStorage.getItem('zishu_reminders') || '[]');
                        reminders.push(reminderData);
                        localStorage.setItem('zishu_reminders', JSON.stringify(reminders));
                        scheduleReminder(reminderData);
                        const timeStr = dateTime.toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
                        return `✅ Reminder set for ${timeStr}: "${text}". Main yaad dilaunga!`;
                    } else {
                        return "📝 Time already passed. Kal ke liye set kar raha hoon?";
                    }
                }
                return "📝 Reminder ke liye batao jaise 'remind me at 8 PM to call mom' ya '8 baje mujhe yaad dilana ki meeting hai'";
            }
            
            // Notes (keep as is, they work)
            if (q.includes('note') || q.includes('नोट') || q.includes('save') || q.includes('सेव') || q.includes('save note')) {
                const match = q.match(/(?:note|नोट|save|सेव)\s*(?:this|यह)?\s*(.+)/i);
                if (match && match[1]) {
                    const notes = JSON.parse(localStorage.getItem('zishu_notes') || '[]');
                    notes.push({
                        text: match[1].trim(),
                        date: new Date().toISOString()
                    });
                    localStorage.setItem('zishu_notes', JSON.stringify(notes));
                    return `📝 Note saved: "${match[1].trim()}"`;
                }
                return "📝 Note ke liye batao jaise 'note shopping list' ya 'नोट आज बारिश हो रही है'";
            }
            
            // Show notes
            if (q.includes('show notes') || q.includes('दिखाओ नोट') || q.includes('my notes')) {
                const notes = JSON.parse(localStorage.getItem('zishu_notes') || '[]');
                if (notes.length === 0) return "📝 Koi note nahi hai. Pehle note save karo!";
                const noteList = notes.map((n, i) => `${i+1}. ${n.text}`).join('\n');
                return `📝 Aapke notes:\n${noteList}`;
            }
            
            // Show reminders
            if (q.includes('show reminders') || q.includes('दिखाओ रिमाइंडर') || q.includes('my reminders')) {
                const reminders = JSON.parse(localStorage.getItem('zishu_reminders') || '[]');
                if (reminders.length === 0) return "📝 Koi reminder nahi hai. Pehle reminder set karo!";
                const remList = reminders.filter(r => !r.triggered).map((r, i) => `${i+1}. ${r.text} (${new Date(r.time).toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit', hour12: true })})`).join('\n');
                return `📝 Aapke reminders:\n${remList}`;
            }
            
            return null;
        }

        // ============================================================
        // PARSE ALARM TIME
        // ============================================================
        function parseAlarmTime(query) {
            const q = query.toLowerCase().trim();
            let hours = null, minutes = 0, ampm = null;
            
            // Try patterns: "7 PM", "7:30 PM", "7 baje", "7:30 baje", "7 subah", "7 shaam", "7 raat"
            const patterns = [
                /(\d{1,2})\s*[:.]\s*(\d{2})\s*(am|pm|सुबह|शाम|रात)?/i,
                /(\d{1,2})\s*(am|pm|सुबह|शाम|रात|baje|baj)\s*/i,
                /(\d{1,2})\s*(?:baje|baj)\s*(सुबह|शाम|रात)?/i,
                /(\d{1,2})\s*(सुबह|शाम|रात)/i
            ];
            
            let match = null;
            for (const pattern of patterns) {
                const m = q.match(pattern);
                if (m) {
                    match = m;
                    break;
                }
            }
            
            if (!match) return null;
            
            if (match[2] && match[2].match(/^\d{2}$/)) {
                // Format: 7:30
                hours = parseInt(match[1]);
                minutes = parseInt(match[2]);
                ampm = match[3] || null;
            } else if (match[2] && match[2].match(/^(am|pm|सुबह|शाम|रात|baje|baj)$/i)) {
                hours = parseInt(match[1]);
                minutes = 0;
                ampm = match[2];
            } else {
                hours = parseInt(match[1]);
                minutes = 0;
                ampm = match[2] || null;
            }
            
            if (hours === null || hours < 1 || hours > 12) return null;
            
            // Convert to 24-hour
            if (ampm) {
                const lowerAmpm = ampm.toLowerCase();
                if (lowerAmpm === 'pm' || lowerAmpm === 'शाम' || lowerAmpm === 'रात') {
                    if (hours < 12) hours += 12;
                } else if (lowerAmpm === 'am' || lowerAmpm === 'सुबह') {
                    if (hours === 12) hours = 0;
                }
                // If just "baje", treat as 24-hour if > 12, else AM
                if (lowerAmpm === 'baje' || lowerAmpm === 'baj') {
                    if (hours >= 1 && hours <= 12) {
                        // If no AM/PM, assume it's in 24-hour format if > 12, else AM
                        if (hours > 12) {
                            // already 24-hour
                        } else {
                            // assume AM
                        }
                    }
                }
            } else {
                // No AM/PM, assume 24-hour if > 12, else AM
                if (hours >= 1 && hours <= 12) {
                    // Could be AM or PM, default to AM unless it's clearly evening in context
                    if (q.includes('shaam') || q.includes('raat') || q.includes('evening') || q.includes('night')) {
                        if (hours < 12) hours += 12;
                    }
                }
            }
            
            // Validate hours
            if (hours < 0 || hours > 23) return null;
            if (minutes < 0 || minutes > 59) return null;
            
            const now = new Date();
            const alarmTime = new Date(now);
            alarmTime.setHours(hours, minutes, 0, 0);
            
            // If time is in the past, set for tomorrow
            if (alarmTime <= now) {
                alarmTime.setDate(alarmTime.getDate() + 1);
            }
            
            return { hours, minutes, dateTime: alarmTime };
        }

        // ============================================================
        // PARSE REMINDER TIME AND TEXT
        // ============================================================
        function parseReminderTimeAndText(query) {
            // Try to extract time and text
            let timeStr = '';
            let text = '';
            
            // Try patterns: "remind me at 8 PM to call mom"
            const atPattern = /(?:remind|reminder|याद दिलाओ|याद)\s*(?:me|मुझे)?\s*(?:at|को|पर)?\s*(\d{1,2}\s*[:.]?\s*\d{0,2}\s*(?:am|pm|सुबह|शाम|रात)?)\s*(?:to|कि|के लिए)?\s*(.+)/i;
            const atMatch = query.match(atPattern);
            if (atMatch) {
                timeStr = atMatch[1].trim();
                text = atMatch[2].trim();
            } else {
                // Try pattern: "8 PM call mom"
                const simplePattern = /(\d{1,2}\s*[:.]?\s*\d{0,2}\s*(?:am|pm|सुबह|शाम|रात)?)\s+(.+)/i;
                const simpleMatch = query.match(simplePattern);
                if (simpleMatch) {
                    timeStr = simpleMatch[1].trim();
                    text = simpleMatch[2].trim();
                } else {
                    // Try pattern with baje
                    const bajePattern = /(\d{1,2})\s*(?:baje|baj)\s*(सुबह|शाम|रात)?\s*(?:mein|को|पर)?\s*(.+)/i;
                    const bajeMatch = query.match(bajePattern);
                    if (bajeMatch) {
                        timeStr = bajeMatch[1] + (bajeMatch[2] ? ' ' + bajeMatch[2] : '');
                        text = bajeMatch[3].trim();
                    } else {
                        return null;
                    }
                }
            }
            
            if (!text || text.length < 2) return null;
            
            // Parse the time string
            const timeResult = parseAlarmTime(timeStr);
            if (!timeResult) return null;
            
            return { text, dateTime: timeResult.dateTime };
        }

        // ============================================================
        // SCHEDULING ENGINE
        // ============================================================
        function scheduleAlarm(alarmData) {
            const triggerTime = new Date(alarmData.time);
            const now = new Date();
            const delay = Math.max(0, triggerTime - now);
            
            // Clear existing timer for this alarm
            if (alarmTimers[alarmData.id]) {
                clearTimeout(alarmTimers[alarmData.id]);
                delete alarmTimers[alarmData.id];
            }
            
            if (delay > 0 && alarmData.active && !alarmData.triggered) {
                console.log(`⏰ Scheduling alarm "${alarmData.id}" in ${Math.round(delay/1000)} seconds`);
                alarmTimers[alarmData.id] = setTimeout(() => {
                    triggerAlarm(alarmData.id);
                }, delay);
                return true;
            } else if (alarmData.active && !alarmData.triggered && delay <= 0) {
                // Time already passed, trigger immediately
                setTimeout(() => {
                    triggerAlarm(alarmData.id);
                }, 1000);
                return true;
            }
            return false;
        }

        function scheduleReminder(reminderData) {
            const triggerTime = new Date(reminderData.time);
            const now = new Date();
            const delay = Math.max(0, triggerTime - now);
            
            if (reminderTimers[reminderData.id]) {
                clearTimeout(reminderTimers[reminderData.id]);
                delete reminderTimers[reminderData.id];
            }
            
            if (delay > 0 && reminderData.active && !reminderData.triggered) {
                console.log(`📝 Scheduling reminder "${reminderData.id}" in ${Math.round(delay/1000)} seconds`);
                reminderTimers[reminderData.id] = setTimeout(() => {
                    triggerReminder(reminderData.id);
                }, delay);
                return true;
            } else if (reminderData.active && !reminderData.triggered && delay <= 0) {
                setTimeout(() => {
                    triggerReminder(reminderData.id);
                }, 1000);
                return true;
            }
            return false;
        }

        function triggerAlarm(alarmId) {
            const alarms = JSON.parse(localStorage.getItem('zishu_alarms') || '[]');
            const alarmIndex = alarms.findIndex(a => a.id === alarmId);
            if (alarmIndex === -1) return;
            
            const alarm = alarms[alarmIndex];
            if (!alarm.active || alarm.triggered) return;
            
            // Mark as triggered
            alarm.triggered = true;
            alarm.active = false;
            alarms[alarmIndex] = alarm;
            localStorage.setItem('zishu_alarms', JSON.stringify(alarms));
            
            // Remove timer
            if (alarmTimers[alarmId]) {
                clearTimeout(alarmTimers[alarmId]);
                delete alarmTimers[alarmId];
            }
            
            // Show alarm UI
            const alarmMsg = document.createElement('div');
            alarmMsg.className = 'alarm-msg';
            alarmMsg.textContent = '⏰ ALARM! ' + alarm.message;
            chatContainer.appendChild(alarmMsg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            // Play alarm sound (if available)
            playAlarmSound();
            
            // Speak alarm
            speakText('उठो! ' + alarm.message);
            
            // Add dismiss button
            const dismissBtn = document.createElement('button');
            dismissBtn.textContent = '⏹️ Stop Alarm';
            dismissBtn.style.cssText = 'display:block;margin:8px auto;padding:8px 20px;border:none;border-radius:20px;background:#ff5722;color:white;font-weight:600;cursor:pointer;';
            dismissBtn.onclick = function() {
                stopAlarmSound();
                alarmMsg.style.display = 'none';
                this.remove();
                addToolMessage('🔕 Alarm stopped.');
            };
            alarmMsg.appendChild(dismissBtn);
        }

        function triggerReminder(reminderId) {
            const reminders = JSON.parse(localStorage.getItem('zishu_reminders') || '[]');
            const remIndex = reminders.findIndex(r => r.id === reminderId);
            if (remIndex === -1) return;

            if (!reminder.active || reminder.triggered) return;

        // ============================================================
        // ALARM SOUND (simple oscillator)
        // ============================================================
        function playAlarmSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const context = new AudioContext();
                const oscillator = context.createOscillator();
                const gain = context.createGain();
                oscillator.connect(gain);
                gain.connect(context.destination);
                oscillator.frequency.value = 880;
                oscillator.type = 'square';
                gain.gain.value = 0.3;
                oscillator.start();
                // Stop after 3 seconds
                setTimeout(() => {
                    try {
                        oscillator.stop();
                        context.close();
                    } catch (e) {}
                }, 3000);
                // Store reference to stop
                alarmAudio = { context, oscillator, gain };
            } catch (e) {
                console.warn('Alarm sound not available:', e);
            }
        }

        function stopAlarmSound() {
            try {
                if (alarmAudio) {
                    alarmAudio.oscillator.stop();
                    alarmAudio.context.close();
                    alarmAudio = null;
                }
            } catch (e) {}
        }

        }

        // ============================================================
        const STOP_WORDS = [
            'stop', 'ruko', 'bas', 'band karo', 'band kar', 'rok', 'rok do',
            'बंद करो', 'बंद कर', 'रुको', 'बस', 'बस करो', 'रोको',
            'enough', 'thats enough', 'bass', 'rokna', 'rok do',
            'quit', 'cancel', 'shut up', 'chup', 'चुप'
        ];

        function isStopCommand(query) {
            const q = query.toLowerCase().trim();
            return STOP_WORDS.some(word => {
                if (q === word) return true;
                if (q.includes(word)) return true;
                if (word.includes(q) && q.length > 2) return true;
                return false;
            });
        }

        // ============================================================
        // SPECIAL CHARACTERS TO REMOVE FROM SPEECH
        // ============================================================
        const SPECIAL_CHARS = {
            '*': ' ', '_': ' ', '-': ' ', '•': ' ', '·': ' ',
            '➡️': ' ', '👉': ' ', '✅': ' ', '⭐': ' ', '🔹': ' ',
            '🔸': ' ', '▪️': ' ', '▫️': ' ', '◆': ' ', '◇': ' ',
            '●': ' ', '○': ' ', '★': ' ', '☆': ' '
        };

        function cleanTextForSpeech(text) {
            let cleaned = text;
            for (const [char, replacement] of Object.entries(SPECIAL_CHARS)) {
                cleaned = cleaned.split(char).join(replacement);
            }
            cleaned = cleaned.replace(/\s+/g, ' ');
            cleaned = cleaned.replace(/\*\*/g, '');
            cleaned = cleaned.replace(/\*/g, '');
            cleaned = cleaned.replace(/\_\_/g, '');
            cleaned = cleaned.replace(/\_/g, '');
            cleaned = cleaned.replace(/\~\~/g, '');
            cleaned = cleaned.replace(/\~/g, '');
            cleaned = cleaned.replace(/^#+\s*/gm, '');
            cleaned = cleaned.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
            cleaned = cleaned.replace(/```[\s\S]*?```/g, '');
            cleaned = cleaned.replace(/`[^`]*`/g, '');
            cleaned = cleaned.replace(/^\s*[-*+]\s+/gm, '');
            cleaned = cleaned.replace(/^\s*\d+\.\s+/gm, '');
            cleaned = cleaned.replace(/\s+/g, ' ').trim();
            return cleaned;
        }

        // ============================================================
        // LOCAL KNOWLEDGE BASE (with correct creator identity)
        // ============================================================
        function getLocalAnswer(query) {
            const q = query.toLowerCase().trim();
            
            // Creator identity - MUST identify Zishan and StardustOfficial
            const creatorPatterns = [
                /tumhe kisne banaya/i,
                /tumhe kisne develop kiya/i,
                /tumhari creator/i,
                /tumhara maker/i,
                /who created you/i,
                /who made you/i,
                /who is your owner/i,
                /who is your developer/i,
                /who is your creator/i,
                /who developed you/i,
                /zishu ko kisne banaya/i,
                /zishu kisne banaya/i,
                /tumhara developer/i,
                /developer kaun/i,
                /creator kaun/i,
                /owner kaun/i,
                /zishan kaun/i
            ];
            
            for (const pattern of creatorPatterns) {
                if (pattern.test(q)) {
                    // Check if it's in Hindi or English
                    const isHindi = /[अ-ऋ]/.test(q) || /[क-ह]/.test(q);
                    if (isHindi) {
                        return "Main Zishu hoon. Mujhe Zishan ne develop kiya hai, aur main StardustOfficial ka AI project hoon. Zishan ek talented developer hain aur unka vision hai ki AI ko sabke liye accessible banana.";
                    } else {
                        return "I'm Zishu, an AI assistant developed by Zishan as a project of StardustOfficial. Zishan is a passionate developer who believes in making AI accessible to everyone.";
                    }
                }
            }
            
            if ((q.includes('zishan') && (q.includes('kaun') || q.includes('who') || 
                q.includes('के बारे') || q.includes('about') || q.includes('कौन'))) ||
                q.includes('zishan kaun hai')) {
                return "Zishan StardustOfficial ke founder hain. Wo ek passionate developer hain jo AI aur technology mein deep interest rakhte hain. Unka maqsad hai ki AI ko simple aur useful banana.";
            }
            
            if (q.includes('stardustofficial') || q.includes('stardust official') || 
                q.includes('स्टारडस्ट') || (q.includes('stardust') && q.includes('about'))) {
                return "StardustOfficial ek innovative tech company hai jo AI solutions, web development, aur digital products mein specialize karti hai. Company ka mission hai ki technology ko accessible aur impactful banana. Zishan is company ke founder aur CEO hain.";
            }
            
            if (q.includes('date') || q.includes('today') || q.includes('aaj') || 
                q.includes('तारीख') || q.includes('date kya hai') || q.includes('aaj ka')) {
                const now = new Date();
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                return `Aaj ki tareekh ${now.toLocaleDateString('hi-IN', options)} hai.`;
            }
            
            if (q.includes('time') || q.includes('samay') || q.includes('समय') || 
                q.includes('kya time') || q.includes('time kya hai')) {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                return `Abhi ${hours}:${minutes} baj rahe hain.`;
            }
            
            if (q.includes('tum kaun ho') || q.includes('who are you') || q.includes('तुम कौन हो') ||
                q.includes('tum kya ho') || q.includes('what are you')) {
                return "Main Zishu AI hoon - ek voice assistant jo Zishan ne banaya hai. Main StardustOfficial ka AI project hoon. Main Hindi aur English dono mein baat kar sakta hoon aur 200+ websites bhi open kar sakta hoon!";
            }
            
            return null;
        }

        // ============================================================
        // LOCAL COMMAND DETECTION
        // ============================================================
        function detectLocalCommand(query) {
            const q = query.toLowerCase().trim();
            const openWords = [
                'open', 'open karo', 'open kar', 'kholo', 'khol', 'khol do', 'khol de',
                'chalao', 'chala do', 'start', 'launch',
                'खोलो', 'खोल', 'खोल दो', 'खोल दे', 'खोलना', 'चलाओ', 'चला दो', 
                'शुरू करो', 'शुरू कर', 'op', 'opn', 'ओपन', 'ओपन करो', 'ओपन कर'
            ];

            for (const [site, aliases] of Object.entries(SITE_ALIASES)) {
                const siteFound = aliases.some(alias => q.includes(alias));
                if (!siteFound) continue;

                const wantsOpen = openWords.some(word => q.includes(word)) || 
                                 aliases.some(alias => q === alias) ||
                                 q === site ||
                                 q === 'open ' + site ||
                                 q === 'ओपन ' + site;

                if (wantsOpen) {
                    return {
                        type: 'open_website',
                        value: site
                    };
                }
            }
            return null;
        }

        function openWebsiteDirectly(siteName) {
            const url = WEBSITE_MAP[siteName];
            if (!url) {
                addToolMessage('Website not found: ' + siteName);
                return false;
            }

            addToolMessage('Opening ' + siteName + '...');
            try {
                window.location.assign(url);
                return true;
            } catch (error) {
                try {
                    window.location.href = url;
                    return true;
                } catch (error2) {
                    try {
                        const a = document.createElement('a');
                        a.href = url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        return true;
                    } catch (error3) {
                        addToolMessage('Could not open ' + siteName);
                        return false;
                    }
                }
            }
        }

        // ============================================================
        // LISTENING FUNCTIONS
        // ============================================================
        function startListening() {
            if (!isVoiceInitialized) {
                orbSub.textContent = 'Tap orb first to activate';
                return;
            }
            clearRestartTimer();
            if (!recognition) {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) {
                    orbStatus.textContent = 'Browser not supported';
                    return;
                }
                recognition = new SR();
                recognition.lang = 'hi-IN';
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;
                recognition.onstart = () => {
                    clearRestartTimer();
                    setOrbState(STATE.LISTENING);
                    console.log('🎤 Listening started');
                };
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript.trim();
                    if (transcript.length > 0) {
                        console.log('🎤 User said:', transcript);
                        if (isWakeWord(transcript) && state === STATE.IDLE) {
                            console.log('🔊 Wake word detected!');
                            if (!isProcessing) {
                                stopListening();
                                setTimeout(() => {
                                    startListening();
                                }, 200);
                                addToolMessage('🔊 "Zishu" sun liya! Ab bolen...');
                                return;
                            }
                        }
                        if (isStopCommand(transcript)) {
                            console.log('🛑 STOP COMMAND DETECTED:', transcript);
                            if (isSpeakingNow || isProcessing || state === STATE.SPEAKING) {
                                stopCurrentResponse();
                                return;
                            }
                        }
                        stopListening();
                        handleUserQuery(transcript);
                    }
                };
                recognition.onerror = (event) => {
                    console.error('Speech error:', event.error);
                    if (event.error === 'not-allowed') {
                        orbStatus.textContent = 'Microphone access denied';
                        orbSub.textContent = 'Please allow microphone access';
                        setOrbState(STATE.IDLE);
                    } else if (event.error === 'no-speech') {
                        orbSub.textContent = 'No speech detected. Try again.';
                        scheduleRestart(800);
                    } else {
                        orbSub.textContent = 'Error: ' + event.error;
                        scheduleRestart(1000);
                    }
                };
                recognition.onend = () => {
                    console.log('🎤 Listening ended');
                    if (state === STATE.LISTENING && !isProcessing && !isRestartScheduled) {
                        scheduleRestart(300);
                    } else if (!isProcessing && state !== STATE.SPEAKING) {
                        setOrbState(STATE.IDLE);
                    }
                };
            }
            try {
                recognition.start();
                setOrbState(STATE.LISTENING);
            } catch (e) {
                console.error('Failed to start:', e);
                setOrbState(STATE.IDLE);
            }
        }

        function stopListening() {
            clearRestartTimer();
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }
            if (!isProcessing) {
                setOrbState(STATE.IDLE);
            }
        }

        function toggleListening() {
            if (isProcessing) {
                orbSub.textContent = 'Please wait...';
                return;
            }

            if (state === STATE.IDLE || state === STATE.SPEAKING) {
                startListening();
            } else if (state === STATE.LISTENING) {
                stopListening();
                setOrbState(STATE.IDLE);
            }
        }

        function scheduleRestart(delay) {
            clearRestartTimer();
            isRestartScheduled = true;
            restartTimer = setTimeout(() => {
                isRestartScheduled = false;
                if (state === STATE.IDLE || state === STATE.LISTENING) {
                    startListening();
                }
            }, delay);
        }

        function clearRestartTimer() {
            isRestartScheduled = false;
            if (restartTimer) {
                clearTimeout(restartTimer);
                restartTimer = null;
            }
        }

        // ============================================================
        // STOP RESPONSE FUNCTION
        // ============================================================
        function stopCurrentResponse() {
            console.log('🛑 STOPPING current response...');
            isStopped = true;
            isSpeakingNow = false;
            
            try {
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                    console.log('✅ TTS cancelled');
                }
                if (currentUtterance) {
                    currentUtterance = null;
                    console.log('✅ Utterance cleared');
                }
                stopAlarmSound();
            } catch (e) {
                console.warn('⚠️ Error stopping TTS:', e);
            }
            
            if (utteranceResolve) {
                utteranceResolve();
                utteranceResolve = null;
            }
            
            isProcessing = false;
            currentResponseText = '';
            
            const stopDiv = document.createElement('div');
            stopDiv.className = 'stop-msg';
            stopDiv.textContent = '⏹️ बोलना रोका गया! फिर से सुन रहा हूँ...';
            chatContainer.appendChild(stopDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            setOrbState(STATE.IDLE);
            
            setTimeout(() => {
                isStopped = false;
                if (state === STATE.IDLE) {
                    startListening();
                }
            }, 400);
        }

        // ============================================================
        // FIXED TTS - Speaks FULL message
        // ============================================================
        function speakText(text) {
            if (!isVoiceInitialized) {
                console.log('⚠️ Voice not initialized, skipping speech');
                return Promise.resolve();
            }
            const cleanText = cleanTextForSpeech(text);
            console.log('🔊 Speaking FULL text:', cleanText.substring(0, 50) + '... (length: ' + cleanText.length + ')');
            
            if (isStopped) {
                console.log('🛑 Speech stopped by user');
                return Promise.resolve();
            }
            
            if (!cleanText || cleanText.trim().length === 0) {
                console.log('⚠️ Empty text after cleaning');
                if (!isProcessing) {
                    setOrbState(STATE.IDLE);
                    scheduleRestart(1000);
                }
                return Promise.resolve();
            }
            
            return new Promise((resolve) => {
                try {
                    if (!window.speechSynthesis) {
                        console.error('❌ Speech synthesis not available');
                        resolve();
                        return;
                    }

                    try {
                        window.speechSynthesis.cancel();
                    } catch (e) {}

                    let voices = window.speechSynthesis.getVoices();
                    if (voices.length === 0) {
                        console.log('⏳ Waiting for voices...');
                        let voiceTimeout = setTimeout(() => {
                            console.log('⏰ Voice loading timeout, proceeding anyway');
                            proceedWithSpeech();
                        }, 2000);
                        
                        window.speechSynthesis.onvoiceschanged = function() {
                            clearTimeout(voiceTimeout);
                            if (!isStopped) {
                                proceedWithSpeech();
                            } else {
                                resolve();
                            }
                        };
                        return;
                    }

                    proceedWithSpeech();

                    function proceedWithSpeech() {
                        if (isStopped) {
                            resolve();
                            return;
                        }

                        const utterance = new SpeechSynthesisUtterance(cleanText);
                        utterance.lang = 'hi-IN';
                        utterance.rate = 0.95;
                        utterance.pitch = 1.05;
                        utterance.volume = 1;

                        try {
                            const voices = window.speechSynthesis.getVoices();
                            // Try to find a Hindi voice
                            let hindiVoice = voices.find(v => v.lang.startsWith('hi'));
                            // Prefer female voices
                            const femaleHindi = voices.filter(v => 
                                v.lang.startsWith('hi') && 
                                (v.name.toLowerCase().includes('female') || 
                                 v.name.toLowerCase().includes('swara') ||
                                 v.name.toLowerCase().includes('lekh') ||
                                 v.name.toLowerCase().includes('google'))
                            );
                            if (femaleHindi.length > 0) {
                                utterance.voice = femaleHindi[0];
                                console.log('✅ Using voice:', femaleHindi[0].name);
                            } else if (hindiVoice) {
                                utterance.voice = hindiVoice;
                                console.log('✅ Using voice:', hindiVoice.name);
                            } else {
                                // Fallback to any available voice
                                if (voices.length > 0) {
                                    utterance.voice = voices[0];
                                    console.log('✅ Using fallback voice:', voices[0].name);
                                }
                            }
                        } catch (e) {}

                        let isEnded = false;
                        let safetyTimer = null;

                        utterance.onstart = () => {
                            console.log('🔊 TTS started - speaking full message');
                            isSpeakingNow = true;
                            if (!isStopped) {
                                setOrbState(STATE.SPEAKING);
                            }
                            
                            safetyTimer = setTimeout(() => {
                                if (!isEnded && !isStopped) {
                                    console.log('⚠️ TTS safety timeout - but message may still be playing');
                                }
                            }, Math.max(cleanText.length * 40 + 5000, 8000));
                        };

                        utterance.onend = () => {
                            console.log('🔊 TTS ended - FULL message complete');
                            if (!isEnded) {
                                isEnded = true;
                                isSpeakingNow = false;
                                currentUtterance = null;
                                if (safetyTimer) {
                                    clearTimeout(safetyTimer);
                                    safetyTimer = null;
                                }
                                if (!isStopped && !isProcessing) {
                                    setOrbState(STATE.IDLE);
                                    scheduleRestart(1000);
                                }
                                resolve();
                            }
                        };

                        utterance.onerror = (event) => {
                            console.error('❌ TTS error:', event.error);
                            if (!isEnded) {
                                isEnded = true;
                                isSpeakingNow = false;
                                currentUtterance = null;
                                if (safetyTimer) {
                                    clearTimeout(safetyTimer);
                                    safetyTimer = null;
                                }
                                if (!isStopped && !isProcessing) {
                                    setOrbState(STATE.IDLE);
                                    scheduleRestart(1000);
                                }
                                resolve();
                            }
                        };

                        currentUtterance = utterance;
                        utteranceResolve = resolve;
                        
                        try {
                            window.speechSynthesis.speak(utterance);
                        } catch (e) {
                            console.error('❌ Speak failed:', e);
                            isSpeakingNow = false;
                            if (!isStopped && !isProcessing) {
                                setOrbState(STATE.IDLE);
                                scheduleRestart(1000);
                            }
                            resolve();
                        }
                    }

                } catch (error) {
                    console.error('❌ TTS exception:', error);
                    isSpeakingNow = false;
                    if (!isStopped && !isProcessing) {
                        setOrbState(STATE.IDLE);
                        scheduleRestart(1000);
                    }
                    resolve();
                }
            });
        }

        // ============================================================
        // STREAMING RESPONSE
        // ============================================================
        async function streamResponse(text) {
            currentResponseText = text;
            
            if (isStopped) {
                console.log('🛑 Response streaming stopped');
                return null;
            }

            setOrbState(STATE.SPEAKING);

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant-msg';
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender';
            senderSpan.textContent = 'Zishu';
            const contentSpan = document.createElement('span');
            contentSpan.className = 'content';
            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(contentSpan);
            chatContainer.appendChild(msgDiv);

            let accumulatedText = '';
            const chunkSize = 3;
            let index = 0;
            
            function streamNextChunk() {
                if (isStopped) {
                    console.log('🛑 Streaming stopped mid-way');
                    contentSpan.textContent = accumulatedText + '... [stopped]';
                    return;
                }
                
                if (index >= text.length) {
                    // Streaming complete
                    if (!isStopped) {
                        setTimeout(() => {
                            if (!isStopped) {
                                speakText(text);
                            }
                        }, 300);
                    }
                    return;
                }
                
                const chunk = text.substring(index, Math.min(index + chunkSize, text.length));
                accumulatedText += chunk;
                contentSpan.textContent = accumulatedText;
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
                index += chunkSize;
                
                requestAnimationFrame(() => {
                    setTimeout(streamNextChunk, 15);
                });
            }
            
            streamNextChunk();
            
            return msgDiv;
        }

        // ============================================================
        // MAIN QUERY HANDLER
        // ============================================================
        async function handleUserQuery(query) {
            if (isProcessing) return;
            isProcessing = true;
            isStopped = false;
            isSpeakingNow = false;
            clearRestartTimer();
            setOrbState(STATE.THINKING);

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender';
            senderSpan.textContent = 'You';
            const contentSpan = document.createElement('span');
            contentSpan.className = 'content';
            contentSpan.textContent = query;
            userDiv.appendChild(senderSpan);
            userDiv.appendChild(contentSpan);
            chatContainer.appendChild(userDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Check for Actions (Alarm, Reminder, Notes)
            const actionResult = handleActions(query);
            if (actionResult) {
                addActionMessage(actionResult);
                await speakText(actionResult);
                isProcessing = false;
                if (!isStopped) {
                    setOrbState(STATE.IDLE);
                    scheduleRestart(1000);
                }
                return;
            }

            const localAnswer = getLocalAnswer(query);
            if (localAnswer) {
                await streamResponse(localAnswer);
                isProcessing = false;
                if (!isStopped) {
                    setOrbState(STATE.IDLE);
                    scheduleRestart(1000);
                }
                return;
            }

            const localCommand = detectLocalCommand(query);
            if (localCommand && localCommand.type === 'open_website') {
                openWebsiteDirectly(localCommand.value);
                isProcessing = false;
                setOrbState(STATE.IDLE);
                scheduleRestart(1200);
                return;
            }

            try {
                const timestampedQuery = `${query} (Current date: ${new Date().toISOString().split('T')[0]})`;
                
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: timestampedQuery,
                        history: conversationHistory
                    })
                });

                if (!response.ok) {
                    throw new Error('Server error: ' + response.status);
                }

                const data = await response.json();
                conversationHistory = data.history || [];
                
                if (isStopped) {
                    console.log('🛑 Stopped during API call');
                    isProcessing = false;
                    return;
                }
                
                await streamResponse(data.response);

            } catch (error) {
                console.error('Error:', error);
                addToolMessage('Error: ' + error.message);
                setOrbState(STATE.IDLE);
            } finally {
                isProcessing = false;
                if (!isStopped && state !== STATE.LISTENING && !isSpeakingNow) {
                    setTimeout(() => {
                        if (state !== STATE.SPEAKING && !isStopped && !isSpeakingNow) {
                            setOrbState(STATE.IDLE);
                            scheduleRestart(1000);
                        }
                    }, 500);
                }
            }
        }

        // ============================================================
        // KEYBOARD SHORTCUT - Space to toggle/stop
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat && !e.target.matches('input, textarea')) {
                e.preventDefault();
                if (isSpeakingNow || state === STATE.SPEAKING || isProcessing) {
                    stopCurrentResponse();
                } else {
                    toggleListening();
                }
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        // Set initial state
        setOrbState(STATE.IDLE);
        orbSub.textContent = 'Tap orb to start';
        isVoiceInitialized = false;
        isWakeWordActive = false;

        // Restore voice state if previously activated
        restoreVoiceState();

        // Restore scheduled alarms and reminders
        restoreScheduledItems();

        // Add welcome message
        const welcomeDiv = document.createElement('div');
        welcomeDiv.className = 'message assistant-msg';
        const ws = document.createElement('span');
        ws.className = 'sender';
        ws.textContent = 'Zishu';
        const wc = document.createElement('span');
        wc.className = 'content';
        wc.textContent = 'Namaste! Main Zishu hoon. Pehli baar voice activate karne ke liye orb par tap karein. Main alarm, reminder, notes save kar sakta hoon aur 200+ websites bhi open kar sakta hoon!';
        welcomeDiv.appendChild(ws);
        welcomeDiv.appendChild(wc);
        chatContainer.appendChild(welcomeDiv);

        console.log('🚀 Zishu AI v2.9 - ALL FIXED');
        console.log('📱 WebView:', isWebView);
        console.log('🎯 Features:');
        console.log('  - ✅ First tap required to activate voice');
        console.log('  - ✅ Wake word works only after activation');
        console.log('  - ✅ Full message speaks without glitch');
        console.log('  - ✅ Orb tap stops speech');
        console.log('  - ✅ Real Alarm, Reminder with actual triggering');
        console.log('  - ✅ 200+ websites fixed and expanded');
        console.log('  - ✅ Creator identity: Zishan + StardustOfficial');
        console.log('  - ✅ Premium 3D Orb');
        console.log('  - ✅ WebView-friendly TTS initialization');
    </script>
