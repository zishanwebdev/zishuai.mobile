<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zishu AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f7fc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px 24px 16px;
            color: #1a2332;
            overflow: hidden;
        }
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-shrink: 0;
            padding: 0 4px;
        }
        #brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #brand svg {
            width: 32px;
            height: 32px;
        }
        #brand h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #3b82f6, #7b6cf7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #brand .sub {
            font-size: 12px;
            font-weight: 400;
            color: #6b7a8f;
            -webkit-text-fill-color: #6b7a8f;
            background: none;
            margin-left: 4px;
        }
        #status-badge {
            font-size: 13px;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 30px;
            background: #e9edf4;
            color: #6b7a8f;
            transition: all 0.3s ease;
        }
        #status-badge.active {
            background: #3b82f6;
            color: white;
        }
        #orb-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 0 20px;
            flex-shrink: 0;
        }
        #orb {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3b82f6, #1a2332);
            box-shadow: 0 0 60px rgba(59, 130, 246, 0.15);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
        }
        #orb:hover {
            transform: scale(1.04);
        }
        #orb.listening {
            background: radial-gradient(circle at 30% 30%, #4f8ef7, #1a2332);
            box-shadow: 0 0 80px rgba(79, 142, 247, 0.25);
            animation: orbPulse 1.2s ease-in-out infinite;
        }
        #orb.thinking {
            background: radial-gradient(circle at 30% 30%, #7b6cf7, #1a2332);
            box-shadow: 0 0 80px rgba(123, 108, 247, 0.25);
            animation: orbSpin 2s linear infinite;
        }
        #orb.speaking {
            background: radial-gradient(circle at 30% 30%, #3b82f6, #1a2332);
            box-shadow: 0 0 80px rgba(59, 130, 246, 0.2);
            animation: orbSpeak 0.6s ease-in-out infinite alternate;
        }
        @keyframes orbPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes orbSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes orbSpeak {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.04) translateY(-3px); }
        }
        #orb-status {
            margin-top: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #1a2332;
            letter-spacing: -0.2px;
        }
        #orb-sub {
            font-size: 13px;
            color: #6b7a8f;
            margin-top: 4px;
            font-weight: 400;
        }
        #chat-wrapper {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid #e9edf4;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            scroll-behavior: smooth;
        }
        #chat-container::-webkit-scrollbar {
            width: 4px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: #f1f4f9;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: #d0d8e3;
            border-radius: 10px;
        }
        .message {
            margin: 8px 0;
            padding: 12px 18px;
            border-radius: 16px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease;
            line-height: 1.7;
            font-size: 15px;
            font-weight: 400;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }
        .user-msg {
            background: #3b82f6;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .assistant-msg {
            background: #f1f4f9;
            color: #1a2332;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .message .sender {
            font-weight: 600;
            font-size: 12px;
            opacity: 0.7;
            display: block;
            margin-bottom: 3px;
            letter-spacing: 0.3px;
        }
        .assistant-msg .sender {
            color: #6b7a8f;
        }
        .user-msg .sender {
            color: rgba(255, 255, 255, 0.8);
        }
        .message .content {
            display: block;
        }
        .tool-msg {
            background: #e9edf4;
            color: #6b7a8f;
            margin: 6px auto;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            text-align: center;
            max-width: 85%;
            font-weight: 450;
        }
        .stop-msg {
            background: #f8d7da;
            color: #721c24;
            margin: 6px auto;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            text-align: center;
            max-width: 85%;
            font-weight: 450;
            animation: fadeIn 0.3s ease;
        }
        #footer {
            display: flex;
            justify-content: space-between;
            padding: 10px 4px 0;
            flex-shrink: 0;
            font-size: 12px;
            color: #9aa9bb;
            letter-spacing: 0.2px;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (max-width: 480px) {
            body {
                padding: 12px 14px 10px;
            }
            #orb {
                width: 80px;
                height: 80px;
            }
            #brand h1 {
                font-size: 18px;
            }
            #brand .sub {
                font-size: 10px;
            }
            #orb-status {
                font-size: 14px;
            }
            .message {
                font-size: 14px;
                padding: 10px 14px;
                max-width: 88%;
            }
            #chat-container {
                padding: 14px 16px;
            }
            #status-badge {
                font-size: 11px;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

    <div id="header">
        <div id="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="1.8">
                <defs>
                    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3b82f6" />
                        <stop offset="100%" stop-color="#7b6cf7" />
                    </linearGradient>
                </defs>
                <circle cx="12" cy="12" r="10" />
                <path d="M8 12l2 2 4-4" />
                <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
            </svg>
            <div style="display:flex;align-items:baseline;gap:6px;">
                <h1>ZISHU</h1>
                <span class="sub">voice intelligence</span>
            </div>
        </div>
        <div id="status-badge">● Idle</div>
    </div>

    <div id="orb-container">
        <div id="orb"></div>
        <div id="orb-status">Tap orb to start</div>
        <div id="orb-sub">First tap to enable microphone</div>
    </div>

    <div id="chat-wrapper">
        <div id="chat-container"></div>
    </div>

    <div id="footer">
        <span>private · local</span>
        <span>v2.8</span>
    </div>

    <script>
        // ============================================================
        // CONFIG
        // ============================================================
        const BACKEND_URL = 'https://zishu-backend.onrender.com/api/chat';
        
        // ============================================================
        // STATE MACHINE
        // ============================================================
        const STATE = {
            IDLE: 'idle',
            LISTENING: 'listening',
            THINKING: 'thinking',
            SPEAKING: 'speaking'
        };

        let state = STATE.IDLE;
        let recognition = null;
        let isProcessing = false;
        let currentUtterance = null;
        let restartTimer = null;
        let isRestartScheduled = false;
        let isFirstActivation = true;
        let conversationHistory = [];
        let isWebView = false;
        let ttsRetryCount = 0;
        const MAX_TTS_RETRIES = 3;
        let isStopped = false;
        let currentResponseText = '';

        // ============================================================
        // DETECT WEBVIEW
        // ============================================================
        function detectWebView() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            if (/android/i.test(userAgent)) {
                isWebView = true;
                console.log('📱 Running in Android WebView');
            }
        }
        detectWebView();

        // ============================================================
        // DOM REFS
        // ============================================================
        const orb = document.getElementById('orb');
        const orbStatus = document.getElementById('orb-status');
        const orbSub = document.getElementById('orb-sub');
        const chatContainer = document.getElementById('chat-container');
        const statusBadge = document.getElementById('status-badge');

        // ============================================================
        // STOP WORDS - Hindi + English
        // ============================================================
        const STOP_WORDS = [
            'stop', 'ruko', 'bas', 'band karo', 'band kar', 'rok', 'rok do',
            'बंद करो', 'बंद कर', 'रुको', 'बस', 'बस करो', 'रोको',
            'enough', 'thats enough', 'bass', 'rokna', 'rok do',
            'quit', 'cancel', 'shut up', 'chup', 'चुप'
        ];

        // ============================================================
        // LOCAL KNOWLEDGE BASE
        // ============================================================
        function getLocalAnswer(query) {
            const q = query.toLowerCase().trim();
            
            // Creator info
            if (q.includes('tumhe kisne banaya') || q.includes('tum kisne banaya') || 
                q.includes('tumhari creator') || q.includes('tumhara maker') ||
                q.includes('who created you') || q.includes('who made you') ||
                q.includes('किसने बनाया') || q.includes('बनाने वाला')) {
                return "मुझे Zishan ने बनाया है। Zishan ek talented developer hain aur unka vision hai ki AI ko sabke liye accessible banana.";
            }
            
            // Zishan info
            if (q.includes('zishan') && (q.includes('kaun') || q.includes('who') || 
                q.includes('के बारे') || q.includes('about') || q.includes('कौन'))) {
                return "Zishan StardustOfficial ke founder hain. Wo ek passionate developer hain jo AI aur technology mein deep interest rakhte hain. Unka maqsad hai ki AI ko simple aur useful banana.";
            }
            
            // StardustOfficial info
            if (q.includes('stardustofficial') || q.includes('stardust official') || 
                q.includes('स्टारडस्ट') || q.includes('stardust') && q.includes('about')) {
                return "StardustOfficial ek innovative tech company hai jo AI solutions, web development, aur digital products mein specialize karti hai. Company ka mission hai ki technology ko accessible aur impactful banana. Zishan is company ke founder aur CEO hain.";
            }
            
            // Current date/time query
            if (q.includes('date') || q.includes('today') || q.includes('aaj') || 
                q.includes('तारीख') || q.includes('date kya hai') || q.includes('aaj ka')) {
                const now = new Date();
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                return `Aaj ki tareekh ${now.toLocaleDateString('hi-IN', options)} hai.`;
            }
            
            if (q.includes('time') || q.includes('samay') || q.includes('समय') || 
                q.includes('kya time') || q.includes('time kya hai')) {
                const now = new Date();
                return `Abhi ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')} baj rahe hain.`;
            }
            
            // Live updates query
            if (q.includes('latest') || q.includes('today news') || q.includes('kya chal raha') ||
                q.includes('नया') || q.includes('ताजा')) {
                return "Mujhe real-time news ka access nahi hai, lekin main latest topics pe baat kar sakta hoon. Aap specific query puchh sakte hain!";
            }
            
            // AI self-awareness
            if (q.includes('tum kaun ho') || q.includes('who are you') || q.includes('तुम कौन हो') ||
                q.includes('tum kya ho') || q.includes('what are you')) {
                return "Main Zishu AI hoon - ek voice assistant jo Zishan ne banaya hai. Main StardustOfficial ka AI project hoon. Main Hindi aur English dono mein baat kar sakta hoon aur websites bhi open kar sakta hoon!";
            }
            
            return null;
        }

        // ============================================================
        // WEBSITE ALIASES
        // ============================================================
        const SITE_ALIASES = {
            youtube: ['youtube', 'you tube', 'यूट्यूब', 'यू ट्यूब'],
            google: ['google', 'गूगल'],
            gmail: ['gmail', 'जीमेल', 'जी मेल'],
            github: ['github', 'git hub', 'गिटहब', 'गिट हब'],
            instagram: ['instagram', 'insta', 'इंस्टाग्राम', 'इंस्टा'],
            facebook: ['facebook', 'फेसबुक'],
            whatsapp: ['whatsapp', 'व्हाट्सएप', 'व्हाट्सऐप'],
            twitter: ['twitter', 'ट्विटर', 'x'],
            reddit: ['reddit', 'रेडिट'],
            spotify: ['spotify', 'स्पॉटिफाई', 'स्पॉटिफाय'],
            netflix: ['netflix', 'नेटफ्लिक्स'],
            amazon: ['amazon', 'अमेज़न', 'अमेजन'],
            flipkart: ['flipkart', 'फ्लिपकार्ट'],
            linkedin: ['linkedin', 'लिंक्डइन'],
            maps: ['google maps', 'maps', 'गूगल मैप्स', 'मैप्स'],
            drive: ['google drive', 'drive', 'गूगल ड्राइव', 'ड्राइव'],
            docs: ['google docs', 'docs', 'गूगल डॉक्स', 'डॉक्स'],
            translate: ['google translate', 'translate', 'गूगल ट्रांसलेट', 'ट्रांसलेट'],
            zomato: ['zomato', 'जोमैटो'],
            swiggy: ['swiggy', 'स्विगी']
        };

        const WEBSITE_MAP = {
            youtube: 'https://youtube.com',
            google: 'https://google.com',
            gmail: 'https://gmail.com',
            github: 'https://github.com',
            reddit: 'https://reddit.com',
            twitter: 'https://twitter.com',
            instagram: 'https://instagram.com',
            whatsapp: 'https://web.whatsapp.com',
            maps: 'https://maps.google.com',
            drive: 'https://drive.google.com',
            docs: 'https://docs.google.com',
            translate: 'https://translate.google.com',
            facebook: 'https://facebook.com',
            linkedin: 'https://linkedin.com',
            spotify: 'https://spotify.com',
            netflix: 'https://netflix.com',
            amazon: 'https://amazon.in',
            flipkart: 'https://flipkart.com',
            zomato: 'https://zomato.com',
            swiggy: 'https://swiggy.com'
        };

        // ============================================================
        // LOCAL COMMAND DETECTION
        // ============================================================
        function detectLocalCommand(query) {
            const q = query.toLowerCase().trim();
            const openWords = [
                'open', 'open karo', 'open kar', 'kholo', 'khol', 'khol do', 'khol de',
                'chalao', 'chala do', 'start', 'launch',
                'खोलो', 'खोल', 'खोल दो', 'खोल दे', 'चलाओ', 'चला दो', 'शुरू करो', 'शुरू कर'
            ];

            for (const [site, aliases] of Object.entries(SITE_ALIASES)) {
                const siteFound = aliases.some(alias => q.includes(alias));
                if (!siteFound) continue;

                const wantsOpen = openWords.some(word => q.includes(word)) || 
                                 aliases.some(alias => q === alias) ||
                                 q === site;

                if (wantsOpen) {
                    return {
                        type: 'open_website',
                        value: site
                    };
                }
            }
            return null;
        }

        function openWebsiteDirectly(siteName) {
            const url = WEBSITE_MAP[siteName];
            if (!url) {
                addToolMessage('Website not found: ' + siteName);
                return false;
            }

            addToolMessage('Opening ' + siteName + '...');
            try {
                window.location.assign(url);
                return true;
            } catch (error) {
                try {
                    window.location.href = url;
                    return true;
                } catch (error2) {
                    try {
                        const a = document.createElement('a');
                        a.href = url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        return true;
                    } catch (error3) {
                        addToolMessage('Could not open ' + siteName);
                        return false;
                    }
                }
            }
        }

        // ============================================================
        // ORB CONTROLS
        // ============================================================
        function setOrbState(newState) {
            state = newState;
            orb.className = newState;

            const statusMap = {
                idle: ['Zishu is ready', 'Tap orb or press Space to talk', '● Idle'],
                listening: ['Listening...', 'Speak now', '● Listening'],
                thinking: ['Thinking...', 'Processing your request', '◉ Thinking'],
                speaking: ['Speaking...', 'Zishu is responding', '● Speaking']
            };
            const [status, sub, badge] = statusMap[newState] || statusMap.idle;
            orbStatus.textContent = status;
            orbSub.textContent = sub;
            statusBadge.textContent = badge;
            statusBadge.className = newState === STATE.IDLE ? '' : 'active';
        }

        orb.addEventListener('click', toggleListening);

        function toggleListening() {
            if (isProcessing) {
                orbSub.textContent = 'Please wait...';
                return;
            }

            if (state === STATE.IDLE || state === STATE.SPEAKING) {
                startListening();
            } else if (state === STATE.LISTENING) {
                stopListening();
                setOrbState(STATE.IDLE);
            }
        }

        // ============================================================
        // STOP RESPONSE FUNCTION
        // ============================================================
        function stopCurrentResponse() {
            console.log('🛑 Stopping current response...');
            isStopped = true;
            
            // Stop TTS
            try {
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
                if (currentUtterance) {
                    currentUtterance = null;
                }
            } catch (e) {
                console.warn('⚠️ Error stopping TTS:', e);
            }
            
            // Reset state
            isProcessing = false;
            currentResponseText = '';
            
            // Show stop message
            const stopDiv = document.createElement('div');
            stopDiv.className = 'stop-msg';
            stopDiv.textContent = '⏹️ Response stopped. Listening again...';
            chatContainer.appendChild(stopDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            setOrbState(STATE.IDLE);
            
            // Start listening again after short delay
            setTimeout(() => {
                isStopped = false;
                if (state === STATE.IDLE) {
                    startListening();
                }
            }, 500);
        }

        // ============================================================
        // CHECK FOR STOP WORDS IN QUERY
        // ============================================================
        function isStopCommand(query) {
            const q = query.toLowerCase().trim();
            return STOP_WORDS.some(word => q.includes(word) || q === word);
        }

        // ============================================================
        // SPEECH RECOGNITION
        // ============================================================
        function initSpeechRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                orbStatus.textContent = 'Browser not supported';
                if (isWebView) {
                    orbSub.textContent = 'Try using Chrome browser';
                }
                return null;
            }

            const rec = new SR();
            rec.lang = 'hi-IN';
            rec.continuous = false;
            rec.interimResults = false;
            rec.maxAlternatives = 1;

            rec.onstart = () => {
                clearRestartTimer();
                setOrbState(STATE.LISTENING);
                if (isFirstActivation) {
                    isFirstActivation = false;
                    orbSub.textContent = 'Listening...';
                }
            };

            rec.onresult = (event) => {
                const transcript = event.results[0][0].transcript.trim();
                if (transcript.length > 0) {
                    console.log('🎤 User said:', transcript);
                    stopListening();
                    
                    // Check if it's a stop command
                    if (isStopCommand(transcript) && (state === STATE.SPEAKING || isProcessing)) {
                        stopCurrentResponse();
                        return;
                    }
                    
                    handleUserQuery(transcript);
                }
            };

            rec.onerror = (event) => {
                console.error('Speech error:', event.error);
                if (event.error === 'not-allowed') {
                    orbStatus.textContent = 'Microphone access denied';
                    orbSub.textContent = 'Please allow microphone access';
                    setOrbState(STATE.IDLE);
                } else if (event.error === 'no-speech') {
                    orbSub.textContent = 'No speech detected. Try again.';
                    scheduleRestart(800);
                } else {
                    orbSub.textContent = 'Error: ' + event.error;
                    scheduleRestart(1000);
                }
            };

            rec.onend = () => {
                if (state === STATE.LISTENING && !isProcessing && !isRestartScheduled) {
                    scheduleRestart(300);
                } else if (!isProcessing && state !== STATE.SPEAKING) {
                    setOrbState(STATE.IDLE);
                }
            };

            return rec;
        }

        // ============================================================
        // LISTENING FUNCTIONS
        // ============================================================
        function startListening() {
            clearRestartTimer();
            if (!recognition) {
                recognition = initSpeechRecognition();
                if (!recognition) return;
            }
            try {
                recognition.start();
                setOrbState(STATE.LISTENING);
            } catch (e) {
                console.error('Failed to start:', e);
                setOrbState(STATE.IDLE);
            }
        }

        function stopListening() {
            clearRestartTimer();
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }
            if (!isProcessing) {
                setOrbState(STATE.IDLE);
            }
        }

        function scheduleRestart(delay) {
            clearRestartTimer();
            isRestartScheduled = true;
            restartTimer = setTimeout(() => {
                isRestartScheduled = false;
                if (state === STATE.IDLE || state === STATE.LISTENING) {
                    startListening();
                }
            }, delay);
        }

        function clearRestartTimer() {
            isRestartScheduled = false;
            if (restartTimer) {
                clearTimeout(restartTimer);
                restartTimer = null;
            }
        }

        // ============================================================
        // UI HELPERS
        // ============================================================
        function addToolMessage(text) {
            const div = document.createElement('div');
            div.className = 'tool-msg';
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ============================================================
        // TTS FUNCTION
        // ============================================================
        function speakText(text) {
            console.log('🔊 Attempting to speak:', text.substring(0, 50) + '...');
            
            // Check if stopped
            if (isStopped) {
                console.log('🛑 Speech stopped by user');
                return;
            }
            
            ttsRetryCount = 0;
            
            try {
                if (!window.speechSynthesis) {
                    console.error('❌ Speech synthesis not available');
                    return;
                }

                try {
                    window.speechSynthesis.cancel();
                } catch (e) {}

                let voices = window.speechSynthesis.getVoices();
                if (voices.length === 0) {
                    console.log('⏳ Voices not loaded yet, waiting...');
                    window.speechSynthesis.onvoiceschanged = function() {
                        voices = window.speechSynthesis.getVoices();
                        if (voices.length > 0) {
                            if (!isStopped) speakText(text);
                        }
                    };
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                utterance.volume = 1;

                let hindiVoice = null;
                try {
                    const femaleHindi = voices.filter(v => 
                        v.lang.startsWith('hi') && 
                        (v.name.toLowerCase().includes('female') || 
                         v.name.toLowerCase().includes('swara') ||
                         v.name.toLowerCase().includes('lekh') ||
                         v.name.toLowerCase().includes('google') ||
                         v.name.toLowerCase().includes('karen'))
                    );
                    
                    if (femaleHindi.length > 0) {
                        hindiVoice = femaleHindi[0];
                        console.log('✅ Found female Hindi voice:', hindiVoice.name);
                    } else {
                        const anyHindi = voices.find(v => v.lang.startsWith('hi'));
                        if (anyHindi) {
                            hindiVoice = anyHindi;
                            console.log('✅ Found Hindi voice:', anyHindi.name);
                        }
                    }
                } catch (e) {
                    console.warn('⚠️ Voice selection error:', e);
                }

                if (hindiVoice) {
                    utterance.voice = hindiVoice;
                }

                utterance.onstart = () => {
                    console.log('🔊 TTS started');
                    if (!isStopped) {
                        setOrbState(STATE.SPEAKING);
                    }
                };

                utterance.onend = () => {
                    console.log('🔊 TTS ended successfully');
                    currentUtterance = null;
                    ttsRetryCount = 0;
                    if (!isStopped && !isProcessing) {
                        setOrbState(STATE.IDLE);
                        scheduleRestart(1000);
                    }
                };

                utterance.onerror = (event) => {
                    console.error('❌ TTS error:', event.error);
                    currentUtterance = null;
                    
                    if (isStopped) return;
                    
                    if (ttsRetryCount < MAX_TTS_RETRIES) {
                        ttsRetryCount++;
                        console.log(`🔄 Retrying TTS (${ttsRetryCount}/${MAX_TTS_RETRIES})...`);
                        setTimeout(() => {
                            if (!isStopped && !isProcessing) {
                                speakText(text);
                            }
                        }, 500 * ttsRetryCount);
                    } else {
                        if (!isStopped && !isProcessing) {
                            setOrbState(STATE.IDLE);
                            scheduleRestart(1000);
                        }
                    }
                };

                currentUtterance = utterance;
                
                try {
                    window.speechSynthesis.speak(utterance);
                } catch (e) {
                    console.error('❌ Speak failed:', e);
                }

                const safetyTimeout = setTimeout(() => {
                    if (state === STATE.SPEAKING && !isProcessing && !isStopped) {
                        console.log('⚠️ TTS safety timeout - resetting');
                        try {
                            window.speechSynthesis.cancel();
                        } catch (e) {}
                        currentUtterance = null;
                        setOrbState(STATE.IDLE);
                        scheduleRestart(1000);
                    }
                }, Math.max(text.length * 30 + 2000, 3000));

                utterance._safetyTimeout = safetyTimeout;

            } catch (error) {
                console.error('❌ TTS exception:', error);
                if (!isStopped && !isProcessing) {
                    setOrbState(STATE.IDLE);
                    scheduleRestart(1000);
                }
            }
        }

        // ============================================================
        // FORCE VOICE LOADING
        // ============================================================
        function forceLoadVoices() {
            if (!window.speechSynthesis) {
                console.warn('⚠️ Speech synthesis not available');
                return;
            }

            try {
                let attempts = 0;
                const maxAttempts = 5;
                
                function tryLoadVoices() {
                    attempts++;
                    const voices = window.speechSynthesis.getVoices();
                    console.log(`📢 Voice load attempt ${attempts}: ${voices.length} voices found`);
                    
                    if (voices.length > 0) {
                        console.log('✅ Voices loaded successfully');
                        return true;
                    }
                    
                    if (attempts < maxAttempts) {
                        console.log(`⏳ Retrying voice load (${attempts}/${maxAttempts})...`);
                        setTimeout(tryLoadVoices, 500 * attempts);
                    } else {
                        console.warn('⚠️ Could not load voices after multiple attempts');
                    }
                    return false;
                }

                tryLoadVoices();
                
                window.speechSynthesis.onvoiceschanged = function() {
                    const voices = window.speechSynthesis.getVoices();
                    console.log(`📢 Voices changed: ${voices.length} voices found`);
                };

            } catch (e) {
                console.warn('⚠️ Error loading voices:', e);
            }
        }

        // ============================================================
        // STREAMING RESPONSE
        // ============================================================
        async function streamResponse(text) {
            // Store full response for stop functionality
            currentResponseText = text;
            
            // Check if stopped during streaming
            if (isStopped) {
                console.log('🛑 Response streaming stopped');
                return null;
            }

            setOrbState(STATE.SPEAKING);

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant-msg';
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender';
            senderSpan.textContent = 'Zishu';
            const contentSpan = document.createElement('span');
            contentSpan.className = 'content';
            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(contentSpan);
            chatContainer.appendChild(msgDiv);

            let accumulatedText = '';
            const chunkSize = 3;
            for (let i = 0; i < text.length; i += chunkSize) {
                // Check if stopped during streaming
                if (isStopped) {
                    console.log('🛑 Streaming stopped mid-way');
                    contentSpan.textContent = accumulatedText + '... [stopped]';
                    return msgDiv;
                }
                
                const chunk = text.substring(i, Math.min(i + chunkSize, text.length));
                accumulatedText += chunk;
                contentSpan.textContent = accumulatedText;
                chatContainer.scrollTop = chatContainer.scrollHeight;
                await new Promise(r => setTimeout(r, 20 + Math.random() * 10));
            }

            // Only speak if not stopped
            if (!isStopped) {
                setTimeout(() => {
                    speakText(text);
                }, 300);
            }
            
            return msgDiv;
        }

        // ============================================================
        // MAIN QUERY HANDLER
        // ============================================================
        async function handleUserQuery(query) {
            if (isProcessing) return;
            isProcessing = true;
            isStopped = false;
            clearRestartTimer();
            setOrbState(STATE.THINKING);

            // Add user message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender';
            senderSpan.textContent = 'You';
            const contentSpan = document.createElement('span');
            contentSpan.className = 'content';
            contentSpan.textContent = query;
            userDiv.appendChild(senderSpan);
            userDiv.appendChild(contentSpan);
            chatContainer.appendChild(userDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Check local knowledge first
            const localAnswer = getLocalAnswer(query);
            if (localAnswer) {
                await streamResponse(localAnswer);
                isProcessing = false;
                if (!isStopped) {
                    setOrbState(STATE.IDLE);
                    scheduleRestart(1000);
                }
                return;
            }

            // LOCAL COMMAND DETECTION
            const localCommand = detectLocalCommand(query);
            if (localCommand && localCommand.type === 'open_website') {
                openWebsiteDirectly(localCommand.value);
                isProcessing = false;
                setOrbState(STATE.IDLE);
                scheduleRestart(1200);
                return;
            }

            // SEND TO BACKEND
            try {
                // Add timestamp to query for latest answers
                const timestampedQuery = `${query} (Current date: ${new Date().toISOString().split('T')[0]})`;
                
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: timestampedQuery,
                        history: conversationHistory
                    })
                });

                if (!response.ok) {
                    throw new Error('Server error: ' + response.status);
                }

                const data = await response.json();
                conversationHistory = data.history || [];
                
                // Check if stopped during API call
                if (isStopped) {
                    console.log('🛑 Stopped during API call');
                    isProcessing = false;
                    return;
                }
                
                await streamResponse(data.response);

            } catch (error) {
                console.error('Error:', error);
                addToolMessage('Error: ' + error.message);
                setOrbState(STATE.IDLE);
            } finally {
                isProcessing = false;
                if (!isStopped && state !== STATE.LISTENING) {
                    setTimeout(() => {
                        if (state !== STATE.SPEAKING && !isStopped) {
                            setOrbState(STATE.IDLE);
                            scheduleRestart(1000);
                        }
                    }, 500);
                }
            }
        }

        // ============================================================
        // KEYBOARD SHORTCUT - Space to stop when speaking
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat && !e.target.matches('input, textarea')) {
                e.preventDefault();
                
                // If currently speaking or processing, stop
                if (state === STATE.SPEAKING || isProcessing) {
                    stopCurrentResponse();
                } else {
                    toggleListening();
                }
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        setTimeout(forceLoadVoices, 100);
        setTimeout(forceLoadVoices, 500);
        setTimeout(forceLoadVoices, 1000);

        setOrbState(STATE.IDLE);

        const welcomeDiv = document.createElement('div');
        welcomeDiv.className = 'message assistant-msg';
        const ws = document.createElement('span');
        ws.className = 'sender';
        ws.textContent = 'Zishu';
        const wc = document.createElement('span');
        wc.className = 'content';
        wc.textContent = 'Namaste! Main Zishu hoon. Orb dabayein aur baat karein. Main Hindi aur English dono samajhti hoon.';
        welcomeDiv.appendChild(ws);
        welcomeDiv.appendChild(wc);
        chatContainer.appendChild(welcomeDiv);

        console.log('🚀 Zishu AI v2.8 - All Features Updated');
        console.log('📡 Backend URL:', BACKEND_URL);
        console.log('📱 WebView:', isWebView);
        console.log('🎯 Features:');
        console.log('  - Stop command: "Ruko", "Bas", "Stop"');
        console.log('  - Creator: Zishan (StardustOfficial)');
        console.log('  - Latest answers with timestamp');
        console.log('  - Space to toggle/stop');
    </script>
