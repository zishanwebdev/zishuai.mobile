<html lang="hi">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f7fc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px 24px 16px;
            color: #1a2332;
            overflow: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }
        body.dark-mode {
            background: #0a0e17;
            color: #e8edf5;
        }
        body.dark-mode #chat-wrapper {
            background: #131b2e;
            border-color: #1e2a3f;
        }
        body.dark-mode #chat-container::-webkit-scrollbar-track {
            background: #1a2438;
        }
        body.dark-mode #chat-container::-webkit-scrollbar-thumb {
            background: #2a3a55;
        }
        body.dark-mode .assistant-msg {
            background: #1a2438;
            color: #e8edf5;
        }
        body.dark-mode .user-msg {
            background: #3b82f6;
        }
        body.dark-mode .tool-msg {
            background: #1a2438;
            color: #8aa0c0;
        }
        body.dark-mode .stop-msg {
            background: #2a1a1a;
            color: #ff6b6b;
        }
        body.dark-mode #status-badge {
            background: #1a2438;
            color: #8aa0c0;
        }
        body.dark-mode #status-badge.active {
            background: #3b82f6;
            color: white;
        }
        body.dark-mode #orb-status {
            color: #e8edf5;
        }
        body.dark-mode #orb-sub {
            color: #8aa0c0;
        }
        body.dark-mode #footer {
            color: #4a5a7a;
        }
        body.dark-mode #brand .sub {
            color: #8aa0c0;
            -webkit-text-fill-color: #8aa0c0;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-shrink: 0;
            padding: 0 4px;
        }
        #header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #brand svg {
            width: 32px;
            height: 32px;
        }
        #brand h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #3b82f6, #7b6cf7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #brand .sub {
            font-size: 12px;
            font-weight: 400;
            color: #6b7a8f;
            -webkit-text-fill-color: #6b7a8f;
            background: none;
            margin-left: 4px;
        }
        #header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #status-badge {
            font-size: 13px;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 30px;
            background: #e9edf4;
            color: #6b7a8f;
            transition: all 0.3s ease;
        }
        #status-badge.active {
            background: #3b82f6;
            color: white;
        }
        #dark-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9edf4;
            width: 40px;
            height: 40px;
        }
        body.dark-mode #dark-toggle {
            background: #1a2438;
        }
        #dark-toggle svg {
            width: 24px;
            height: 24px;
            fill: #1a2332;
            transition: fill 0.3s ease;
        }
        body.dark-mode #dark-toggle svg {
            fill: #e8edf5;
        }
        #dark-toggle:hover {
            transform: scale(1.05);
        }

        #orb-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 0 20px;
            flex-shrink: 0;
        }
        #orb {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3b82f6, #1a2332);
            box-shadow: 0 0 60px rgba(59, 130, 246, 0.15);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
        }
        #orb:hover {
            transform: scale(1.04);
        }
        #orb.listening {
            background: radial-gradient(circle at 30% 30%, #4f8ef7, #1a2332);
            box-shadow: 0 0 80px rgba(79, 142, 247, 0.25);
            animation: orbPulse 1.2s ease-in-out infinite;
        }
        #orb.thinking {
            background: radial-gradient(circle at 30% 30%, #7b6cf7, #1a2332);
            box-shadow: 0 0 80px rgba(123, 108, 247, 0.25);
            animation: orbSpin 2s linear infinite;
        }
        #orb.speaking {
            background: radial-gradient(circle at 30% 30%, #3b82f6, #1a2332);
            box-shadow: 0 0 80px rgba(59, 130, 246, 0.2);
            animation: orbSpeak 0.6s ease-in-out infinite alternate;
        }
        @keyframes orbPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes orbSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes orbSpeak {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.04) translateY(-3px); }
        }
        #orb-status {
            margin-top: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #1a2332;
            letter-spacing: -0.2px;
            transition: color 0.3s ease;
        }
        #orb-sub {
            font-size: 13px;
            color: #6b7a8f;
            margin-top: 4px;
            font-weight: 400;
            transition: color 0.3s ease;
        }
        #chat-wrapper {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid #e9edf4;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            scroll-behavior: smooth;
        }
        #chat-container::-webkit-scrollbar {
            width: 4px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: #f1f4f9;
            transition: background 0.3s ease;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: #d0d8e3;
            border-radius: 10px;
        }
        .message {
            margin: 8px 0;
            padding: 12px 18px;
            border-radius: 16px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease;
            line-height: 1.7;
            font-size: 15px;
            font-weight: 400;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }
        .user-msg {
            background: #3b82f6;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .assistant-msg {
            background: #f1f4f9;
            color: #1a2332;
            margin-right: auto;
            border-bottom-left-radius: 4px;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .message .sender {
            font-weight: 600;
            font-size: 12px;
            opacity: 0.7;
            display: block;
            margin-bottom: 3px;
            letter-spacing: 0.3px;
        }
        .assistant-msg .sender {
            color: #6b7a8f;
        }
        .user-msg .sender {
            color: rgba(255, 255, 255, 0.8);
        }
        .message .content {
            display: block;
            white-space: pre-wrap;
        }
        .tool-msg {
            background: #e9edf4;
            color: #6b7a8f;
            margin: 6px auto;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            text-align: center;
            max-width: 85%;
            font-weight: 450;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .stop-msg {
            background: #f8d7da;
            color: #721c24;
            margin: 6px auto;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            text-align: center;
            max-width: 85%;
            font-weight: 450;
            animation: fadeIn 0.3s ease;
        }
        #footer {
            display: flex;
            justify-content: space-between;
            padding: 10px 4px 0;
            flex-shrink: 0;
            font-size: 12px;
            color: #9aa9bb;
            letter-spacing: 0.2px;
            transition: color 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (max-width: 480px) {
            body {

            #orb {

                height: 80px;

            .message {

                padding: 10px 14px;
                max-width: 88%;
            }
            #chat-container {
                padding: 14px 16px;
            }
            #status-badge {
                font-size: 11px;
                padding: 4px 12px;
            }

                width: 34px;
                height: 34px;
                padding: 6px;
            }

                height: 20px;
            }
        }

</head>

        // ============================================================
        // SPECIAL CHARACTERS TO REMOVE FROM SPEECH
        // ============================================================
        const SPECIAL_CHARS = {
            '*': ' ',
            '_': ' ',
            '-': ' ',
            '•': ' ',
            '·': ' ',
            '➡️': ' ',
            '👉': ' ',
            '✅': ' ',

        // ============================================================
        // FUNCTION TO CLEAN TEXT FOR SPEECH
        // ============================================================
        function cleanTextForSpeech(text) {
            let cleaned = text;
            
            // Remove markdown-like symbols
            for (const [char, replacement] of Object.entries(SPECIAL_CHARS)) {
                cleaned = cleaned.split(char).join(replacement);
            }
            
            // Remove multiple spaces
            cleaned = cleaned.replace(/\s+/g, ' ');
            
            // Remove markdown bold/italic markers
            cleaned = cleaned.replace(/\*\*/g, '');
            cleaned = cleaned.replace(/\*/g, '');
            cleaned = cleaned.replace(/\_\_/g, '');
            cleaned = cleaned.replace(/\_/g, '');
            cleaned = cleaned.replace(/\~\~/g, '');
            cleaned = cleaned.replace(/\~/g, '');
            
            // Remove markdown headers
            cleaned = cleaned.replace(/^#+\s*/gm, '');
            
            // Remove markdown links [text](url)
            cleaned = cleaned.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
            
            // Remove code blocks
            cleaned = cleaned.replace(/```[\s\S]*?```/g, '');
            cleaned = cleaned.replace(/`[^`]*`/g, '');
            
            // Remove list markers
            cleaned = cleaned.replace(/^\s*[-*+]\s+/gm, '');
            cleaned = cleaned.replace(/^\s*\d+\.\s+/gm, '');
            
            // Clean up extra spaces
            cleaned = cleaned.replace(/\s+/g, ' ').trim();
            
            return cleaned;
        }

        // ============================================================
        // LOCAL COMMAND DETECTION
        // ============================================================
        function detectLocalCommand(query) {
            const q = query.toLowerCase().trim();
            const openWords = [
                'open', 'open karo', 'open kar', 'kholo', 'khol', 'khol do', 'khol de',
                'chalao', 'chala do', 'start', 'launch',
                'खोलो', 'खोल', 'खोल दो', 'खोल दे', 'खोलना', 'चलाओ', 'चला दो', 
                'शुरू करो', 'शुरू कर', 'op', 'opn', 'ओपन', 'ओपन करो'
            ];

            for (const [site, aliases] of Object.entries(SITE_ALIASES)) {
                const siteFound = aliases.some(alias => q.includes(alias));
                if (!siteFound) continue;

                const wantsOpen = openWords.some(word => q.includes(word)) || 
                                 aliases.some(alias => q === alias) ||
                                 q === site ||
                                 q === 'open ' + site;

                if (wantsOpen) {
                    return {
                        type: 'open_website',
                        value: site
                    };
                }
            }
            return null;
        }

        function openWebsiteDirectly(siteName) {
            const url = WEBSITE_MAP[siteName];
            if (!url) {
                addToolMessage('Website not found: ' + siteName);
                return false;
            }

            addToolMessage('Opening ' + siteName + '...');
            try {
                window.location.assign(url);
                return true;
            } catch (error) {
                try {
                    window.location.href = url;
                    return true;
                } catch (error2) {
                    try {
                        const a = document.createElement('a');
                        a.href = url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        return true;
                    } catch (error3) {
                        addToolMessage('Could not open ' + siteName);
                        return false;
                    }
                }
            }
        }

        function isStopCommand(query) {
            const q = query.toLowerCase().trim();
            // Check exact matches and partial matches
            return STOP_WORDS.some(word => {
                // Exact match
                if (q === word) return true;
                // Word in query
                if (q.includes(word)) return true;
                // Query in word (for short words like "bas")
                if (word.includes(q) && q.length > 2) return true;
                return false;
            });
        }

        // ============================================================
        // SPEECH RECOGNITION
        // ============================================================
        function initSpeechRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                orbStatus.textContent = 'Browser not supported';
                if (isWebView) {
                    orbSub.textContent = 'Try using Chrome browser';
                }
                return null;
            }

            const rec = new SR();
            rec.lang = 'hi-IN';
            rec.continuous = false;
            rec.interimResults = false;
            rec.maxAlternatives = 1;

            rec.onstart = () => {
                clearRestartTimer();
                setOrbState(STATE.LISTENING);
                if (isFirstActivation) {
                    isFirstActivation = false;
                    orbSub.textContent = 'Listening...';
                }
            };

            rec.onresult = (event) => {
                const transcript = event.results[0][0].transcript.trim();
                if (transcript.length > 0) {
                    console.log('🎤 User said:', transcript);
                    
                    // Check if it's a stop command - CRITICAL FIX
                    if (isStopCommand(transcript)) {
                        console.log('🛑 STOP COMMAND DETECTED:', transcript);
                        // If speaking or processing, stop immediately
                        if (isSpeakingNow || isProcessing || state === STATE.SPEAKING) {
                            stopCurrentResponse();
                            return;
                        }
                    }
                    
                    stopListening();
                    handleUserQuery(transcript);
                }
            };

            rec.onerror = (event) => {
                console.error('Speech error:', event.error);
                if (event.error === 'not-allowed') {
                    orbStatus.textContent = 'Microphone access denied';
                    orbSub.textContent = 'Please allow microphone access';
                    setOrbState(STATE.IDLE);
                } else if (event.error === 'no-speech') {
                    orbSub.textContent = 'No speech detected. Try again.';
                    scheduleRestart(800);
                } else {
                    orbSub.textContent = 'Error: ' + event.error;
                    scheduleRestart(1000);
                }
            };

            rec.onend = () => {
                if (state === STATE.LISTENING && !isProcessing && !isRestartScheduled) {
                    scheduleRestart(300);
                } else if (!isProcessing && state !== STATE.SPEAKING) {
                    setOrbState(STATE.IDLE);
                }
            };

            return rec;
        }

        // ============================================================
        // LISTENING FUNCTIONS
        // ============================================================
        function startListening() {
            clearRestartTimer();
            if (!recognition) {
                recognition = initSpeechRecognition();
                if (!recognition) return;
            }
            try {
                recognition.start();
                setOrbState(STATE.LISTENING);
            } catch (e) {
                console.error('Failed to start:', e);
                setOrbState(STATE.IDLE);
            }
        }

        function stopListening() {
            clearRestartTimer();
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }
            if (!isProcessing) {
                setOrbState(STATE.IDLE);
            }
        }

        function scheduleRestart(delay) {
            clearRestartTimer();
            isRestartScheduled = true;
            restartTimer = setTimeout(() => {
                isRestartScheduled = false;
                if (state === STATE.IDLE || state === STATE.LISTENING) {
                    startListening();
                }
            }, delay);
        }

        function clearRestartTimer() {
            isRestartScheduled = false;
            if (restartTimer) {
                clearTimeout(restartTimer);
                restartTimer = null;
            }
        }

        // ============================================================
        // FIXED TTS - No stuttering, clean speech
        // ============================================================
        function speakText(text) {
            // Clean text for speech - remove special characters
            const cleanText = cleanTextForSpeech(text);
            console.log('🔊 Speaking (cleaned):', cleanText.substring(0, 50) + '...');
            
            if (isStopped) {
                console.log('🛑 Speech stopped by user');
                return;
            }
            
            if (!cleanText || cleanText.trim().length === 0) {
                console.log('⚠️ Empty text after cleaning');
                if (!isProcessing) {
                    setOrbState(STATE.IDLE);
                    scheduleRestart(1000);
                }
                return;
            }
            
            try {
                if (!window.speechSynthesis) {
                    console.error('❌ Speech synthesis not available');
                    return;
                }

                // Cancel any ongoing speech
                try {
                    window.speechSynthesis.cancel();
                } catch (e) {}

                // Wait for voices
                let voices = window.speechSynthesis.getVoices();
                if (voices.length === 0) {
                    console.log('⏳ Waiting for voices...');
                    window.speechSynthesis.onvoiceschanged = function() {
                        if (!isStopped) {
                            speakText(text);
                        }
                    };
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.95;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                // Find best voice
                try {
                    const femaleHindi = voices.filter(v => 
                        v.lang.startsWith('hi') && 
                        (v.name.toLowerCase().includes('female') || 
                         v.name.toLowerCase().includes('swara') ||
                         v.name.toLowerCase().includes('lekh') ||
                         v.name.toLowerCase().includes('google'))
                    );
                    
                    if (femaleHindi.length > 0) {
                        utterance.voice = femaleHindi[0];
                        console.log('✅ Using voice:', femaleHindi[0].name);
                    } else {
                        const anyHindi = voices.find(v => v.lang.startsWith('hi'));
                        if (anyHindi) {
                            utterance.voice = anyHindi;
                            console.log('✅ Using voice:', anyHindi.name);
                        }
                    }
                } catch (e) {}

                let isEnded = false;

                utterance.onstart = () => {
                    console.log('🔊 TTS started');
                    isSpeakingNow = true;
                    if (!isStopped) {
                        setOrbState(STATE.SPEAKING);
                    }
                };

                utterance.onend = () => {
                    console.log('🔊 TTS ended');
                    if (!isEnded) {
                        isEnded = true;
                        isSpeakingNow = false;
                        currentUtterance = null;
                        if (!isStopped && !isProcessing) {
                            setOrbState(STATE.IDLE);
                            scheduleRestart(1000);
                        }
                    }
                };

                utterance.onerror = (event) => {
                    console.error('❌ TTS error:', event.error);
                    if (!isEnded) {
                        isEnded = true;
                        isSpeakingNow = false;
                        currentUtterance = null;
                        if (!isStopped && !isProcessing) {
                            setOrbState(STATE.IDLE);
                            scheduleRestart(1000);
                        }
                    }
                };

                currentUtterance = utterance;
                
                try {
                    window.speechSynthesis.speak(utterance);
                } catch (e) {
                    console.error('❌ Speak failed:', e);
                    if (!isStopped && !isProcessing) {
                        setOrbState(STATE.IDLE);
                        scheduleRestart(1000);
                    }
                }

                // Safety timeout
                const safetyTimeout = setTimeout(() => {
                    if ((state === STATE.SPEAKING || isSpeakingNow) && !isProcessing && !isStopped) {
                        console.log('⚠️ TTS safety timeout');
                        try {
                            window.speechSynthesis.cancel();
                        } catch (e) {}
                        isSpeakingNow = false;
                        currentUtterance = null;
                        if (!isStopped) {
                            setOrbState(STATE.IDLE);
                            scheduleRestart(1000);
                        }
                    }
                }, Math.max(cleanText.length * 40 + 3000, 5000));

                utterance._safetyTimeout = safetyTimeout;

            } catch (error) {
                console.error('❌ TTS exception:', error);
                isSpeakingNow = false;
                if (!isStopped && !isProcessing) {
                    setOrbState(STATE.IDLE);
                    scheduleRestart(1000);
                }
            }
        }

        // ============================================================

        // ============================================================
        function forceLoadVoices() {
            if (!window.speechSynthesis) return;
            
            try {
                let attempts = 0;
                const maxAttempts = 5;
                
                function tryLoadVoices() {
                    attempts++;
                    const voices = window.speechSynthesis.getVoices();
                    console.log(`📢 Voice load attempt ${attempts}: ${voices.length} voices`);
                    
                    if (voices.length > 0) {
                        console.log('✅ Voices loaded:', voices.map(v => v.name + ' (' + v.lang + ')').join(', '));
                        return true;
                    }
                    
                    if (attempts < maxAttempts) {
                        setTimeout(tryLoadVoices, 500 * attempts);
                    }
                    return false;
                }

                tryLoadVoices();
                
                window.speechSynthesis.onvoiceschanged = function() {
                    const voices = window.speechSynthesis.getVoices();
                    console.log(`📢 Voices changed: ${voices.length} voices`);
                };

            } catch (e) {
                console.warn('⚠️ Error loading voices:', e);
            }
        }

        // ============================================================
        // STREAMING RESPONSE - Clean text before display
        // ============================================================
        async function streamResponse(text) {
            currentResponseText = text;
            
            if (isStopped) {
                console.log('🛑 Response streaming stopped');
                return null;
            }

            setOrbState(STATE.SPEAKING);

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant-msg';
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender';
            senderSpan.textContent = 'Zishu';
            const contentSpan = document.createElement('span');
            contentSpan.className = 'content';
            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(contentSpan);
            chatContainer.appendChild(msgDiv);

            // Display text with special characters preserved for readability
            let accumulatedText = '';
            const chunkSize = 3;
            for (let i = 0; i < text.length; i += chunkSize) {
                if (isStopped) {
                    console.log('🛑 Streaming stopped mid-way');
                    contentSpan.textContent = accumulatedText + '... [stopped]';
                    return msgDiv;
                }
                
                const chunk = text.substring(i, Math.min(i + chunkSize, text.length));
                accumulatedText += chunk;
                contentSpan.textContent = accumulatedText;
                chatContainer.scrollTop = chatContainer.scrollHeight;
                await new Promise(r => setTimeout(r, 25));
            }

            // Speak the cleaned version
            if (!isStopped) {
                setTimeout(() => {
                    if (!isStopped) {
                        speakText(text);
                    }
                }, 200);
            }
            
            return msgDiv;
        }

        // ============================================================
        // MAIN QUERY HANDLER
        // ============================================================
        async function handleUserQuery(query) {
            if (isProcessing) return;
            isProcessing = true;
            isStopped = false;
            isSpeakingNow = false;
            clearRestartTimer();
            setOrbState(STATE.THINKING);

            // Add user message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender';
            senderSpan.textContent = 'You';
            const contentSpan = document.createElement('span');
            contentSpan.className = 'content';
            contentSpan.textContent = query;
            userDiv.appendChild(senderSpan);
            userDiv.appendChild(contentSpan);
            chatContainer.appendChild(userDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Check local knowledge first
            const localAnswer = getLocalAnswer(query);
            if (localAnswer) {
                await streamResponse(localAnswer);
                isProcessing = false;
                if (!isStopped) {
                    setOrbState(STATE.IDLE);
                    scheduleRestart(1000);
                }
                return;
            }

            // LOCAL COMMAND DETECTION
            const localCommand = detectLocalCommand(query);
            if (localCommand && localCommand.type === 'open_website') {
                openWebsiteDirectly(localCommand.value);
                isProcessing = false;
                setOrbState(STATE.IDLE);
                scheduleRestart(1200);
                return;
            }

            // SEND TO BACKEND
            try {
                const timestampedQuery = `${query} (Current date: ${new Date().toISOString().split('T')[0]})`;
                
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: timestampedQuery,
                        history: conversationHistory
                    })
                });

                if (!response.ok) {
                    throw new Error('Server error: ' + response.status);
                }

                const data = await response.json();
                conversationHistory = data.history || [];
                
                if (isStopped) {
                    console.log('🛑 Stopped during API call');
                    isProcessing = false;
                    return;
                }
                
                await streamResponse(data.response);

            } catch (error) {
                console.error('Error:', error);
                addToolMessage('Error: ' + error.message);
                setOrbState(STATE.IDLE);
            } finally {
                isProcessing = false;
                if (!isStopped && state !== STATE.LISTENING) {
                    setTimeout(() => {
                        if (state !== STATE.SPEAKING && !isStopped && !isSpeakingNow) {
                            setOrbState(STATE.IDLE);
                            scheduleRestart(1000);
                        }
                    }, 500);
                }
            }
        }

        // ============================================================
        // KEYBOARD SHORTCUT - Space to stop
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat && !e.target.matches('input, textarea')) {
                e.preventDefault();
                if (isSpeakingNow || state === STATE.SPEAKING || isProcessing) {
                    stopCurrentResponse();
                } else {
                    toggleListening();
                }
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        setTimeout(forceLoadVoices, 100);
        setTimeout(forceLoadVoices, 500);
        setTimeout(forceLoadVoices, 1000);

        setOrbState(STATE.IDLE);

        const welcomeDiv = document.createElement('div');
        welcomeDiv.className = 'message assistant-msg';
        const ws = document.createElement('span');
        ws.className = 'sender';
        ws.textContent = 'Zishu';
        const wc = document.createElement('span');
        wc.className = 'content';
        wc.textContent = 'Namaste! Main Zishu hoon. Orb dabayein aur baat karein. Main 100+ websites open kar sakta hoon, games aur apps bhi!';
        welcomeDiv.appendChild(ws);
        welcomeDiv.appendChild(wc);
        chatContainer.appendChild(welcomeDiv);

        console.log('🚀 Zishu AI v2.8 - All Fixed');
        console.log('📱 WebView:', isWebView);
        console.log('🎯 Features:');
        console.log('  - Fixed TTS (no stuttering)');
        console.log('  - Fixed STOP command');
        console.log('  - Special chars removed from speech');
        console.log('  - Dark Mode toggle');
        console.log('  - 100+ websites/apps/games');
    </script>
</body>
